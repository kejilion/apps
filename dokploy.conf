# Dokploy 应用配置，供 kejilion.sh 应用市场加载。
local app_id="dokploy"
local app_name="Dokploy"
local app_text="开源的自托管部署平台，支持应用、数据库和 Docker Compose 的部署与管理。"
local app_url="https://dokploy.com"
local docker_name="dokploy-entry"
local docker_port="15060"
local docker_app_update_mode="preserve_entry"
local app_size="5"

# 本配置部署 Dokploy 管理面板和专属 PostgreSQL，并启用“仅远程服务器”业务部署模式。
# 面板入口绑定本机回环地址；外部访问需另行配置域名反向代理，安装脚本不创建域名或证书。
# Dokploy 使用本机单节点 Swarm，并访问宿主 Docker socket；专属资源不构成安全隔离。
# 安装时关闭 Dokploy 的自动 Docker 清理，更新和卸载前核对设置及资源归属。
# 卸载前备份并归档应用数据，保留镜像和 Swarm，不执行 Docker 全局清理。

docker_app_install() {
    DOKPLOY_PORT="$docker_port" bash -Eeuo pipefail <<'DOKPLOY_INSTALL'
dokploy_health() {
    local attempt
    for attempt in $(seq 1 90); do
        if curl -fsS --max-time 3 "http://127.0.0.1:${docker_port}/api/trpc/settings.health" | python3 -c 'import json, sys; value=json.load(sys.stdin); sys.exit(value.get("result", {}).get("data", {}).get("json", {}).get("status") != "ok")' 2>/dev/null; then
            return 0
        fi
        sleep 2
    done
    echo "Dokploy 入口健康检查未通过；安装未完成，请检查服务状态和日志。" >&2
    return 1
}
dokploy_swarm_mode() {
    python3 - <<'DOKPLOY_SWARM_CHECK'
import json, subprocess
swarm = json.loads(subprocess.check_output(['docker', 'info', '--format', '{{json .Swarm}}'], text=True))
state = swarm.get('LocalNodeState')
if state == 'inactive':
    print('init')
elif state == 'active' and swarm.get('ControlAvailable') and swarm.get('NodeID'):
    nodes = subprocess.check_output(['docker', 'node', 'ls', '-q'], text=True).split()
    if len(nodes) != 1 or subprocess.check_output(
        ['docker', 'node', 'inspect', '--format', '{{.ID}}', nodes[0]], text=True
    ).strip() != swarm['NodeID']:
        raise SystemExit('此安装方式要求本机为 Swarm 的唯一节点且为 manager；请检查现有集群。')
    print('reuse:' + swarm['NodeID'])
else:
    raise SystemExit('Swarm 状态不受支持；只允许 inactive 或本机单节点 manager。')
DOKPLOY_SWARM_CHECK
}

dokploy_install_failure() {
    local status="$1" created_id="$2"
    if [ "$status" -ne 0 ] && [ -n "$created_id" ]; then
        # 核对 ID、名称和归属后，将本次创建的后端缩容至 0；保留数据库及配置供排查。
        python3 - "$created_id" <<'DOKPLOY_INSTALL_FAILURE' || echo "无法确认或停止本次 Dokploy 服务，请检查保留的安装状态。" >&2
import json, subprocess, sys
service_id = sys.argv[1]
result = subprocess.run(['docker', 'service', 'inspect', service_id], stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=15)
if result.returncode:
    raise SystemExit(1)
try:
    items = json.loads(result.stdout)
    valid = (len(items) == 1 and items[0].get('ID') == service_id and
             items[0].get('Spec', {}).get('Name') == 'dokploy' and
             items[0].get('Spec', {}).get('Labels', {}).get('io.kejilion.app') == 'dokploy')
except (ValueError, TypeError, AttributeError):
    valid = False
if not valid:
    raise SystemExit(1)
stopped = subprocess.run(['docker', 'service', 'scale', service_id + '=0'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=30)
if stopped.returncode:
    raise SystemExit(1)
print('安装未成功，已停止本次创建的 Dokploy 后端；数据与配置已保留。', file=sys.stderr)
DOKPLOY_INSTALL_FAILURE
    fi
    return "$status"
}

dokploy_protections_ok() {
    docker exec "$pg_container" psql -X -v ON_ERROR_STOP=1 -U dokploy -d dokploy -Atc \
        'SELECT CASE WHEN count(*) > 0 AND bool_and(NOT "enableDockerCleanup" AND "remoteServersOnly") THEN '\''ok'\'' ELSE '\''unsafe'\'' END FROM "webServerSettings";' | grep -qx ok
}

dokploy_enable_socket() {
    python3 - "$created_app_id" <<'DOKPLOY_ENABLE_SOCKET'
import json, subprocess, sys
service_id = sys.argv[1]
items = json.loads(subprocess.check_output(['docker', 'service', 'inspect', service_id], timeout=15))
if not (len(items) == 1 and items[0].get('ID') == service_id and
        items[0].get('Spec', {}).get('Name') == 'dokploy' and
        items[0].get('Spec', {}).get('Labels', {}).get('io.kejilion.app') == 'dokploy'):
    raise SystemExit('本次 Dokploy 服务身份已变化，拒绝授予 Docker socket。')
subprocess.run(['docker', 'service', 'update', '--mount-add',
                'type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock',
                '--force', '--update-order', 'stop-first', '--detach=true', service_id],
               check=True, stdout=subprocess.DEVNULL, timeout=30)
DOKPLOY_ENABLE_SOCKET
}

dokploy_backend_health() {
    local attempt
    for attempt in $(seq 1 90); do
        if python3 - "$created_app_id" <<'DOKPLOY_BACKEND_HEALTH'
import json, subprocess, sys
service_id = sys.argv[1]
def read(args):
    return json.loads(subprocess.check_output(['docker', *args], stderr=subprocess.DEVNULL, timeout=15))
try:
    services = read(['service', 'inspect', service_id])
    if not (len(services) == 1 and services[0].get('ID') == service_id and
            services[0].get('Spec', {}).get('Name') == 'dokploy' and
            services[0].get('Spec', {}).get('Labels', {}).get('io.kejilion.app') == 'dokploy' and
            services[0].get('UpdateStatus', {}).get('State') == 'completed'):
        raise SystemExit(1)
    ids = subprocess.check_output(['docker', 'ps', '-q', '--filter', 'label=com.docker.swarm.service.id=' + service_id], text=True, timeout=15).split()
    if len(ids) != 1:
        raise SystemExit(1)
    tasks = read(['container', 'inspect', *ids])
    if not (len(tasks) == 1 and tasks[0].get('State', {}).get('Running') and
            tasks[0].get('Config', {}).get('Labels', {}).get('com.docker.swarm.service.id') == service_id and
            any(m.get('Type') == 'bind' and m.get('Source') == '/var/run/docker.sock' and
                m.get('Destination') == '/var/run/docker.sock' for m in tasks[0].get('Mounts', []))):
        raise SystemExit(1)
    health = '''fetch("http://127.0.0.1:3000/api/trpc/settings.health", {signal:AbortSignal.timeout(3000)})
      .then(async r => {const v=await r.json(); process.exit(r.ok && v.result?.data?.json?.status === "ok" ? 0 : 1)})
      .catch(() => process.exit(1));'''
    result = subprocess.run(['docker', 'exec', tasks[0]['Id'], 'node', '-e', health],
                            stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=8)
    raise SystemExit(result.returncode)
except (subprocess.SubprocessError, OSError, ValueError, TypeError, KeyError):
    raise SystemExit(1)
DOKPLOY_BACKEND_HEALTH
        then
            return 0
        fi
        sleep 2
    done
    echo "Dokploy 新任务的 socket 或内部健康检查未通过。" >&2
    return 1
}

install_dokploy() (
    set -euo pipefail
    umask 077
    local base="/home/docker/dokploy"
    local docker_port="$DOKPLOY_PORT"
    local swarm_mode pool node_id dependency
    local pg_container app_container attempt
    local created_app_id="" failure_trap
    trap 'dokploy_install_failure "$?" ""' EXIT
    [ "$(id -u)" = 0 ] || { echo "需要 root。" >&2; return 1; }
    [ "$(uname -s)" = Linux ] || { echo "仅支持 Linux。" >&2; return 1; }
    case "$(uname -m)" in x86_64|aarch64|arm64) ;; *) echo "仅支持 amd64 / arm64。" >&2; return 1 ;; esac
    for dependency in docker python3 openssl curl ip ss awk grep seq; do
        command -v "$dependency" >/dev/null || { echo "缺少依赖：$dependency" >&2; return 1; }
    done
    [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] && (( docker_port <= 65535 )) || { echo "入口端口无效。" >&2; return 1; }
    docker compose version >/dev/null
    swarm_mode="$(dokploy_swarm_mode)"
    [ ! -e "$base" ] && [ ! -L "$base" ] || { echo "Dokploy 目录已存在；拒绝覆盖。" >&2; return 1; }
    [ ! -e /etc/dokploy ] && [ ! -L /etc/dokploy ] || { echo "/etc/dokploy 已存在；拒绝覆盖。" >&2; return 1; }
    if docker service inspect dokploy >/dev/null 2>&1 || docker service inspect dokploy-postgres >/dev/null 2>&1 || docker container inspect dokploy-entry >/dev/null 2>&1 || docker network inspect dokploy-network >/dev/null 2>&1 || docker secret inspect dokploy_pg_password >/dev/null 2>&1 || docker secret inspect dokploy_auth >/dev/null 2>&1; then
        echo "Dokploy 名称已被占用；拒绝覆盖。" >&2; return 1
    fi
    if ss -lntH | awk '{print $4}' | grep -Eq ":${docker_port}$"; then
        echo "Dokploy 端口已被占用。" >&2; return 1
    fi

    # 仅新建 Swarm 时选择地址池；复用已有单节点 Swarm 时保留其集群设置。
    pool=""
    if [ "$swarm_mode" = init ]; then
    pool="$(python3 - <<'PY'
import ipaddress, json, subprocess
occupied = []
routes = json.loads(subprocess.check_output(['ip', '-j', '-4', 'route', 'show', 'table', 'all']))
for route in routes:
    dst = route.get('dst', 'default')
    if dst != 'default':
        occupied.append(ipaddress.ip_network(dst, strict=False))
ids = subprocess.check_output(['docker', 'network', 'ls', '-q'], text=True).split()
if ids:
    for network in json.loads(subprocess.check_output(['docker', 'network', 'inspect', *ids])):
        for entry in network.get('IPAM', {}).get('Config') or []:
            subnet = entry.get('Subnet')
            if subnet:
                net = ipaddress.ip_network(subnet, strict=False)
                if net.version == 4:
                    occupied.append(net)
for candidate in ('172.30.0.0/16', '10.244.0.0/16', '10.250.0.0/16', '10.252.0.0/16'):
    net = ipaddress.ip_network(candidate)
    if not any(net.overlaps(existing) for existing in occupied):
        print(candidate)
        break
else:
    raise SystemExit('没有找到不冲突的 Dokploy网络地址段；停止安装。')
PY
)"
    fi

    echo "本配置启用或复用单节点 Swarm，并向 Dokploy 授予宿主 Docker 管理权限。"
    echo "业务部署采用仅远程服务器模式；面板对外访问需另行配置域名反向代理。"
    # 先拉取镜像，成功后再创建应用目录及 Docker 资源。
    docker pull dokploy/dokploy:latest
    docker pull postgres:16
    docker pull nginx:1.28-alpine
    [ "$(dokploy_swarm_mode)" = "$swarm_mode" ] || { echo "准备期间 Swarm 布局已改变，停止安装。" >&2; return 1; }
    mkdir "$base"
    mkdir "$base"/{config,postgres,docker-config,entry}
    printf '%s\n' 'dokploy-v1' > "$base/.owner"
    printf '%s\n' "$docker_port" > "$base/entry-port"
    if [ -n "$pool" ]; then printf '%s\n' "$pool" > "$base/swarm-pool.txt"; fi
    ln -s "$base/config" /etc/dokploy
    if [ "$swarm_mode" = init ]; then
        docker swarm init --advertise-addr 127.0.0.1 --listen-addr 127.0.0.1:2377 \
            --default-addr-pool "$pool" --default-addr-pool-mask-length 24 >/dev/null
    fi
    node_id="$(docker info --format '{{.Swarm.NodeID}}')"
    [ -n "$node_id" ] || { echo "无法识别本机 Swarm 节点。" >&2; return 1; }
    docker network create --driver overlay --attachable --label io.kejilion.app=dokploy dokploy-network >/dev/null
    openssl rand -hex 32 | docker secret create --label io.kejilion.app=dokploy dokploy_pg_password - >/dev/null
    openssl rand -hex 32 | docker secret create --label io.kejilion.app=dokploy dokploy_auth - >/dev/null
    docker service create --detach=true --name dokploy-postgres \
        --label io.kejilion.app=dokploy --constraint "node.id==$node_id" \
        --network dokploy-network --limit-memory 768M --limit-cpu 1 \
        --env POSTGRES_USER=dokploy --env POSTGRES_DB=dokploy \
        --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
        --secret source=dokploy_pg_password,target=postgres_password \
        --mount "type=bind,source=$base/postgres,target=/var/lib/postgresql/data" \
        postgres:16 >/dev/null
    created_app_id="$(docker service create --detach=true --name dokploy \
        --label io.kejilion.app=dokploy --replicas 1 --constraint "node.id==$node_id" \
        --network dokploy-network --limit-memory 2G --limit-cpu 2 \
        --update-order stop-first --update-parallelism 1 \
        --env TZ=Asia/Shanghai --env RELEASE_TAG=latest \
        --env POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password \
        --env BETTER_AUTH_SECRET_FILE=/run/secrets/dokploy_auth_secret \
        --secret source=dokploy_pg_password,target=postgres_password \
        --secret source=dokploy_auth,target=dokploy_auth_secret \
        --mount type=bind,source=/etc/dokploy,target=/etc/dokploy \
        --mount "type=bind,source=$base/docker-config,target=/root/.docker" \
        dokploy/dokploy:latest)"
    # errexit 可能先退出局部作用域；注册 EXIT trap 时固化本次服务 ID。
    printf -v failure_trap 'dokploy_install_failure "$?" %q' "$created_app_id"
    trap "$failure_trap" EXIT
    [ -n "$created_app_id" ] || { echo "无法识别本次创建的 Dokploy 服务。" >&2; return 1; }

    # 首次数据库迁移暂不挂载宿主 Docker socket，也不创建面板入口。
    # 写入并核对设置后重启后端，使其启动时读取已关闭的自动 Docker 清理设置。
    for attempt in $(seq 1 90); do
        pg_container="$(docker ps -q --filter label=com.docker.swarm.service.name=dokploy-postgres | head -1)"
        if [ -n "$pg_container" ] && docker exec "$pg_container" psql -U dokploy -d dokploy -Atc \
            "SELECT to_regclass('public.\"webServerSettings\"') IS NOT NULL" 2>/dev/null | grep -qx t; then
            break
        fi
        sleep 2
    done
    [ -n "$pg_container" ] || { echo "专属数据库未就绪。" >&2; return 1; }
    docker exec -i "$pg_container" psql -v ON_ERROR_STOP=1 -U dokploy -d dokploy >/dev/null <<'SQL'
BEGIN;
ALTER TABLE "webServerSettings" ALTER COLUMN "enableDockerCleanup" SET DEFAULT false;
INSERT INTO "webServerSettings" (id, "enableDockerCleanup", "remoteServersOnly", updated_at)
SELECT 'dokploy', false, true, now()
WHERE NOT EXISTS (SELECT 1 FROM "webServerSettings");
UPDATE "webServerSettings" SET "enableDockerCleanup"=false, "remoteServersOnly"=true, updated_at=now();
COMMIT;
SQL
    dokploy_protections_ok || { echo "数据库中的自动清理与部署设置读回失败，停止安装。" >&2; return 1; }
    dokploy_enable_socket
    dokploy_backend_health
    dokploy_protections_ok || { echo "新任务启动后自动清理与部署设置改变，停止安装。" >&2; return 1; }

    cat > "$base/entry/nginx.conf" <<'NGINX'
events {}
http {
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
    server {
        listen 3000;
        location / {
            proxy_pass http://dokploy:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
NGINX
    cat > "$base/compose.yml" <<YAML
name: dokploy-entry
services:
  entry:
    image: nginx:1.28-alpine
    container_name: dokploy-entry
    restart: always
    labels:
      io.kejilion.app: dokploy
    ports:
      - "127.0.0.1:${docker_port}:3000"
    volumes:
      - ./entry/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
YAML
    docker compose -f "$base/compose.yml" up -d
    dokploy_health
    dokploy_protections_ok || { echo "入口就绪后自动清理与部署设置改变，停止安装。" >&2; return 1; }
    echo "Dokploy 安装完成；本机反向代理入口：http://127.0.0.1:${docker_port}。"
    echo "外部访问请配置域名反向代理；业务部署请在 Dokploy 中添加远程服务器。"
    trap - EXIT
)
install_dokploy
DOKPLOY_INSTALL
}

# 更新与卸载共用的资源检查、备份及恢复逻辑。
dokploy_lifecycle() {
    python3 - "$@" <<'DOKPLOY_LIFECYCLE'
#!/usr/bin/env python3
"""Dokploy 生命周期管理：核对资源归属，更新时保留入口，卸载时归档数据。"""
import argparse
import fcntl
import hashlib
import json
import os
from pathlib import Path
import re
import shutil
import subprocess
import sys
import tempfile
import time

OWNER = "dokploy"
ENTRY_NAME = "dokploy-entry"
LABEL = "io.kejilion.app"
IMAGE = "dokploy/dokploy:latest"
SAFETY_SQL = '''SELECT CASE WHEN count(*) > 0 AND bool_and(NOT "enableDockerCleanup" AND "remoteServersOnly") THEN 'ok' ELSE 'unsafe' END FROM "webServerSettings";'''
EMPTY_SQL = '''SELECT CASE WHEN EXISTS (SELECT 1 FROM "project") OR EXISTS (SELECT 1 FROM "server") THEN 'occupied' ELSE 'empty' END;'''


class Refused(RuntimeError):
    pass


class SafetyChanged(Refused):
    pass


def require(condition, message):
    if not condition:
        raise Refused(message)


def command(args, timeout=120):
    result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=timeout)
    if result.returncode:
        # 命令输出可能包含服务凭据或 secret 备份内容，错误提示只显示命令名称。
        raise Refused("命令失败：" + " ".join(args[:3]))
    return result.stdout


class Lifecycle:
    def __init__(self, run=command, base=Path('/home/docker/dokploy'),
                 link=Path('/etc/dokploy'), archives=Path('/home/docker/dokploy-archives'),
                 sleep=time.sleep, attempts=90):
        self.run, self.base, self.link, self.archives = run, Path(base), Path(link), Path(archives)
        self.sleep, self.attempts = sleep, attempts
        self.port = None

    def text(self, *args, timeout=120):
        return self.run(list(args), timeout=timeout).decode().strip()

    def objects(self, kind, list_args):
        # Swarm 任务可能在列出后、inspect 前消失；仅清单变化时重试。
        # 清单稳定时保留原始失败，不接受不完整的资源详情。
        for attempt in range(5):
            ids = self.text('docker', *list_args).split()
            error = None
            try:
                items = json.loads(self.text('docker', kind, 'inspect', *ids)) if ids else []
            except Refused as caught:
                error = caught
            current = self.text('docker', *list_args).split()
            if set(ids) == set(current):
                if error is not None:
                    raise error
                require(isinstance(items, list) and len(items) == len(ids), 'Docker 资源详情不完整：' + kind)
                return items
            if attempt < 4:
                self.sleep(0.2)
        raise Refused('Docker 资源列表持续变化，请稍后重试：' + kind)

    def inventory(self):
        return {
            'services': self.objects('service', ['service', 'ls', '-q']),
            'containers': self.objects('container', ['ps', '-aq']),
            'networks': self.objects('network', ['network', 'ls', '-q']),
            'secrets': self.objects('secret', ['secret', 'ls', '-q']),
            'volumes': self.objects('volume', ['volume', 'ls', '-q']),
        }

    def files_ok(self):
        require(self.base.is_dir() and not self.base.is_symlink(), 'Dokploy 目录缺失或是符号链接。')
        owner = self.base / '.owner'
        require(owner.is_file() and not owner.is_symlink() and owner.read_text().strip() == 'dokploy-v1', '目录不属于 Dokploy。')
        port_file = self.base / 'entry-port'
        require(port_file.is_file() and not port_file.is_symlink() and port_file.stat().st_uid == os.geteuid() and port_file.stat().st_mode & 0o077 == 0, '入口端口文件归属或权限异常。')
        port = port_file.read_text().strip()
        require(bool(re.fullmatch(r'[1-9][0-9]{0,4}', port)) and int(port) <= 65535, '入口端口文件无效。')
        self.port = port
        require(self.link.is_symlink() and os.readlink(self.link) == str(self.base / 'config'), '/etc/dokploy 归属不符。')
        for name in ['config', 'postgres', 'docker-config', 'entry']:
            path = self.base / name
            require(path.is_dir() and not path.is_symlink(), 'Dokploy 子目录异常：' + name)

    @staticmethod
    def named(items, name, container=False):
        found = [x for x in items if (x.get('Name', '').lstrip('/') if container else x.get('Spec', {}).get('Name', x.get('Name'))) == name]
        require(len(found) <= 1, '重复资源名：' + name)
        return found[0] if found else None

    @staticmethod
    def labels(item):
        return item.get('Spec', {}).get('Labels', item.get('Config', {}).get('Labels', item.get('Labels', {}))) or {}

    def resources(self, inv, expected=None, allow_missing=False):
        result = {
            'app': self.named(inv['services'], 'dokploy'),
            'pg': self.named(inv['services'], 'dokploy-postgres'),
            'entry': self.named(inv['containers'], ENTRY_NAME, True),
            'network': self.named(inv['networks'], 'dokploy-network'),
            'pg_secret': self.named(inv['secrets'], 'dokploy_pg_password'),
            'auth_secret': self.named(inv['secrets'], 'dokploy_auth'),
        }
        for key, item in result.items():
            if item is None:
                require(allow_missing, '缺少 Dokploy 资源：' + key)
                collection = 'containers' if key == 'entry' else 'networks' if key == 'network' else 'secrets' if key.endswith('_secret') else 'services'
                id_key = 'Id' if key in ['entry', 'network'] else 'ID'
                require(not any(x.get(id_key) == expected[key] for x in inv[collection]), 'Dokploy 资源已改名，停止操作：' + key)
                continue
            require(self.labels(item).get(LABEL) == OWNER, '资源归属标签错误：' + key)
            if expected:
                require(item['Id' if key in ['entry', 'network'] else 'ID'] == expected[key], '资源已被替换，拒绝操作：' + key)
        return result

    @staticmethod
    def image(item):
        return item['Spec']['TaskTemplate']['ContainerSpec']['Image']

    @staticmethod
    def identity(resources):
        return {key: value['Id' if key in ['entry', 'network'] else 'ID'] for key, value in resources.items()}

    def shape_ok(self, r, allow_stopped=False):
        network_id = r['network']['Id'] if r['network'] else None
        for key in ['app', 'pg']:
            s = r[key]
            if s is None:
                continue
            spec = s['Spec']
            replicas = spec.get('Mode', {}).get('Replicated', {}).get('Replicas')
            require(replicas in ([0, 1] if allow_stopped and key == 'app' else [1]), '服务副本布局变化：' + key)
            require(not spec.get('EndpointSpec', {}).get('Ports'), '控制面或数据库出现公开端口。')
            require(network_id is not None and {n['Target'] for n in spec['TaskTemplate'].get('Networks', [])} == {network_id}, '服务网络布局变化：' + key)
            cs = spec['TaskTemplate']['ContainerSpec']
            mounts = {(m.get('Type'), m.get('Source'), m.get('Target')) for m in cs.get('Mounts', [])}
            wanted = {('bind', str(self.base / 'postgres'), '/var/lib/postgresql/data')} if key == 'pg' else {
                ('bind', '/var/run/docker.sock', '/var/run/docker.sock'),
                ('bind', str(self.link), '/etc/dokploy'),
                ('bind', str(self.base / 'docker-config'), '/root/.docker'),
            }
            require(mounts == wanted, '服务数据挂载变化：' + key)
            image = self.image(s)
            require(bool(re.fullmatch(r'(?:docker\.io/)?dokploy/dokploy:[^@\s]+(?:@sha256:[0-9a-f]{64})?', image)) if key == 'app' else bool(re.fullmatch(r'(?:docker\.io/)?(?:library/)?postgres:16(?:@sha256:[0-9a-f]{64})?', image)), '服务镜像仓库或数据库主版本变化：' + key)
            secret_keys = ['pg_secret'] if key == 'pg' else ['pg_secret', 'auth_secret']
            require(all(r[x] for x in secret_keys), '服务依赖的凭据缺失。')
            require({x['SecretID'] for x in cs.get('Secrets', [])} == {r[x]['ID'] for x in secret_keys}, '服务凭据引用变化：' + key)
        if r['network']:
            require(r['network'].get('Driver') == 'overlay' and r['network'].get('Attachable') is True, '专属网络类型变化。')
        entry = r['entry']
        if entry:
            labels = self.labels(entry)
            require(labels.get('com.docker.compose.project') in ['dokploy', 'dokploy-entry'] and labels.get('com.docker.compose.service') == 'entry', '入口 Compose 归属错误。')
            require(labels.get('com.docker.compose.project.config_files') == str(self.base / 'compose.yml') and labels.get('com.docker.compose.project.working_dir') == str(self.base), '入口 Compose 配置路径归属错误。')
            ports = entry.get('HostConfig', {}).get('PortBindings') or {}
            require(set(ports) == {'3000/tcp'} and ports['3000/tcp'] == [{'HostIp': '127.0.0.1', 'HostPort': self.port}], '入口必须且只能绑定已记录的本机回环端口。')
            runtime = entry.get('NetworkSettings', {}).get('Ports') or {}
            if entry.get('State', {}).get('Running'):
                require(runtime.get('3000/tcp') == ports['3000/tcp'] and all(not v for k, v in runtime.items() if k != '3000/tcp'), '入口实际发布端口变化。')
            require(set(entry.get('NetworkSettings', {}).get('Networks', {})) == {'dokploy-network'}, '入口连接了非专属网络。')
            mounts = entry.get('Mounts', [])
            require(len(mounts) == 1 and mounts[0].get('Type') == 'bind' and mounts[0].get('Source') == str(self.base / 'entry/nginx.conf') and mounts[0].get('Destination') == '/etc/nginx/nginx.conf' and mounts[0].get('RW') is False, '入口挂载变化。')

    def external_consumers_ok(self, inv, r, ids):
        protected = [os.path.realpath(self.base), os.path.realpath(self.link)]
        def protected_path(value):
            if not value or not os.path.isabs(value):
                return False
            value = os.path.realpath(value)
            # 子目录引用与父目录挂载都可能包含本应用数据。
            return any(os.path.commonpath([value, path]) in [value, path] for path in protected)
        for s in inv['services']:
            if s['ID'] in [ids['app'], ids['pg']]:
                continue
            task = s.get('Spec', {}).get('TaskTemplate', {})
            cs = task.get('ContainerSpec', {})
            used = any(n.get('Target') == ids['network'] for n in task.get('Networks', []))
            used |= any(x.get('SecretID') in [ids['pg_secret'], ids['auth_secret']] for x in cs.get('Secrets', []))
            used |= any(protected_path(m.get('Source', '')) for m in cs.get('Mounts', []))
            require(not used, '其他 Swarm 服务正在引用 Dokploy 资源：' + s['Spec']['Name'])
        for c in inv['containers']:
            if c['Id'] == ids['entry'] or self.labels(c).get('com.docker.swarm.service.id') in [ids['app'], ids['pg']]:
                continue
            used = any(n.get('NetworkID') == ids['network'] for n in c.get('NetworkSettings', {}).get('Networks', {}).values())
            used |= any(protected_path(m.get('Source', '')) for m in c.get('Mounts', []))
            require(not used, '其他容器正在引用 Dokploy 资源：' + c.get('Name', c['Id']))
        for volume in inv['volumes']:
            require(not protected_path((volume.get('Options') or {}).get('device', '')), '命名数据卷正在引用 Dokploy 目录：' + volume['Name'])

    def running_task(self, inv, service_id):
        matches = [c for c in inv['containers'] if self.labels(c).get('com.docker.swarm.service.id') == service_id and c.get('State', {}).get('Running')]
        require(len(matches) == 1, '专属服务必须有且只有一个运行中的本机任务。')
        return matches[0]

    def task(self, inv, service_id):
        return self.running_task(inv, service_id)['Id']

    @staticmethod
    def unchanged(before, after):
        for key in ['app', 'pg']:
            require(before[key]['Spec'] == after[key]['Spec'], '准备期间服务配置被修改，停止更新：' + key)
        for key in ['Id', 'Config', 'Mounts']:
            require(before['entry'].get(key) == after['entry'].get(key), '准备期间入口被修改，停止更新。')

    def task_image_ok(self, inv, service_id, image_id):
        task = self.running_task(inv, service_id)
        require(task.get('Image') == image_id, '实际运行的 Dokploy 容器镜像尚未收敛到拉取的 latest 镜像。')

    def sql(self, inv, ids, query):
        return self.text('docker', 'exec', self.task(inv, ids['pg']), 'psql', '-X', '-v', 'ON_ERROR_STOP=1', '-U', 'dokploy', '-d', 'dokploy', '-Atc', query)

    def health(self):
        raw = self.text('curl', '-fsS', '--max-time', '5', 'http://127.0.0.1:' + self.port + '/api/trpc/settings.health', timeout=10)
        try:
            payload = json.loads(raw)
            require(payload.get('result', {}).get('data', {}).get('json', {}).get('status') == 'ok', 'Dokploy 健康接口未返回 status=ok。')
        except (ValueError, AttributeError):
            raise Refused('Dokploy 健康接口返回了非预期 JSON。')

    def inspect(self, uninstall=False, expected=None):
        self.files_ok()
        inv = self.inventory()
        r = self.resources(inv, expected, allow_missing=uninstall and expected is not None)
        self.shape_ok(r, allow_stopped=uninstall and expected is not None)
        ids = expected or self.identity(r)
        if uninstall:
            self.external_consumers_ok(inv, r, ids)
            if r['pg']:
                require(self.sql(inv, ids, EMPTY_SQL) == 'empty', '仍有 Dokploy 项目或远程服务器登记，拒绝卸载。')
        else:
            try:
                safe = self.sql(inv, ids, SAFETY_SQL) == 'ok'
            except (Refused, subprocess.TimeoutExpired, OSError) as error:
                raise SafetyChanged('无法验证自动 Docker 清理与仅远程部署设置。') from error
            if not safe:
                raise SafetyChanged('Dokploy 的自动 Docker 清理与仅远程部署设置已改变，停止更新。')
        return inv, r, ids

    def archive(self, kind):
        require(not self.archives.is_symlink(), '归档路径不能是符号链接。')
        if not self.archives.exists():
            self.archives.mkdir(mode=0o700)
            self.save(self.archives / '.owner', b'dokploy-archives-v1\n')
        marker = self.archives / '.owner'
        require(self.archives.is_dir() and self.archives.stat().st_uid == os.geteuid() and marker.is_file() and not marker.is_symlink() and marker.read_text().strip() == 'dokploy-archives-v1', '归档目录归属不符。')
        os.chmod(self.archives, 0o700)
        return Path(tempfile.mkdtemp(prefix=time.strftime(kind + '-%Y%m%d-%H%M%S-'), dir=self.archives))

    @staticmethod
    def save(path, value):
        fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, 'wb') as out:
            out.write(value)

    def backup(self, destination, inv, r, ids, final=False):
        pg = self.task(inv, ids['pg'])
        dump = self.run(['docker', 'exec', pg, 'pg_dump', '-U', 'dokploy', '-d', 'dokploy', '-Fc'], timeout=180)
        require(dump.startswith(b'PGDMP') and len(dump) > 5, '数据库备份为空或格式错误。')
        if final:
            temporary = destination / 'database-final.new'
            if temporary.exists():
                require(not temporary.is_symlink(), '最终备份临时路径异常。')
                temporary.unlink()
            self.save(temporary, dump)
            os.replace(temporary, destination / 'database-final.dump')
        else:
            self.save(destination / 'database.dump', dump)
        if final:
            return
        self.save(destination / 'resources.json', json.dumps(r, ensure_ascii=False, indent=2).encode())
        app = self.task(inv, ids['app'])
        for filename in ['postgres_password', 'dokploy_auth_secret']:
            secret = self.run(['docker', 'exec', app, 'cat', '/run/secrets/' + filename], timeout=15)
            require(bool(secret.strip()), '凭据备份为空。')
            self.save(destination / filename, secret)
        for name in ['compose.yml', 'entry-port', 'entry', 'config', 'docker-config']:
            source = self.base / name
            require(source.exists() and not source.is_symlink(), '备份源路径异常：' + name)
            if source.is_dir():
                shutil.copytree(source, destination / name, symlinks=True)
            else:
                shutil.copy2(source, destination / name)

    def plan(self, uninstall=False):
        _, r, ids = self.inspect(uninstall)
        return {'action': 'uninstall' if uninstall else 'update', 'resources': ids,
                'current_image': self.image(r['app']), 'target_image': IMAGE if not uninstall else None,
                'entry': '127.0.0.1:' + self.port, 'preserve': ['other applications', 'Swarm', 'images', 'ingress', 'KPanel domain proxy'],
                'data': 'archive under ' + str(self.archives) if uninstall else 'retain in place'}

    def update(self):
        inv, r, ids = self.inspect()
        before = r
        before_entry = r['entry']
        self.text('docker', 'pull', IMAGE, timeout=600)
        image = json.loads(self.text('docker', 'image', 'inspect', IMAGE))[0]
        require(bool(re.fullmatch(r'sha256:[0-9a-f]{64}', image.get('Id', ''))), '无法识别 latest 的本机镜像 ID。')
        digests = [d.split('@', 1)[1] for d in image.get('RepoDigests', []) if re.fullmatch(r'(?:docker\.io/)?dokploy/dokploy@sha256:[0-9a-f]{64}', d)]
        require(len(set(digests)) == 1, '无法唯一确定官方 latest 镜像 digest。')
        target = IMAGE + '@' + digests[0]
        current = self.image(r['app'])
        inv, r, _ = self.inspect(expected=ids)
        self.unchanged(before, r)
        require(self.image(r['app']) == current and r['entry']['Id'] == before_entry['Id'], '拉取过程中资源被修改，停止更新。')
        if current.endswith('@' + digests[0]):
            self.task_image_ok(inv, ids['app'], image['Id'])
            self.health()
            return {'status': 'already-current', 'image': target, 'entry': '127.0.0.1:' + self.port}
        destination = self.archive('update')
        self.backup(destination, inv, r, ids)
        before = r
        inv, r, _ = self.inspect(expected=ids)
        self.unchanged(before, r)
        # 使用本次解析的 latest digest 更新后端，保留入口和 PostgreSQL 服务。
        self.text('docker', 'service', 'update', '--detach=true', '--update-failure-action', 'pause', '--image', target, ids['app'], timeout=30)
        for _ in range(self.attempts):
            try:
                inv, r, _ = self.inspect(expected=ids)
            except SafetyChanged:
                # 若更新后无法确认自动清理和本机部署仍关闭，停止本应用后端。
                self.text('docker', 'service', 'scale', ids['app'] + '=0', timeout=30)
                raise Refused('更新后的自动清理与部署设置无法确认，已停止专属 Dokploy 服务；请使用备份排查：' + str(destination))
            require(r['entry']['Id'] == before_entry['Id'], '入口被替换，停止更新检查。')
            state = r['app'].get('UpdateStatus', {}).get('State', '')
            require(state not in ['paused', 'rollback_started', 'rollback_paused', 'rollback_completed'], '服务更新未成功；保留备份，不自动降级数据库：' + str(destination))
            if self.image(r['app']) == target and state in ['', 'completed']:
                try:
                    self.task_image_ok(inv, ids['app'], image['Id'])
                    self.health()
                    return {'status': 'updated', 'image': target, 'backup': str(destination), 'entry': '127.0.0.1:' + self.port}
                except Refused:
                    pass
            self.sleep(2)
        raise Refused('更新健康检查超时；保留状态与备份，不自动降级：' + str(destination))

    def checkpoint(self, data):
        target = self.base / '.uninstall-checkpoint.json'
        temporary = self.base / '.uninstall-checkpoint.new'
        if temporary.exists():
            require(not temporary.is_symlink(), '卸载检查点临时文件异常。')
            temporary.unlink()
        self.save(temporary, json.dumps(data, indent=2).encode())
        os.replace(temporary, target)

    def backup_manifest(self, destination, final):
        names = ['resources.json', 'database.dump', 'postgres_password', 'dokploy_auth_secret']
        if final:
            names.append('database-final.dump')
        manifest = {}
        for name in names:
            path = destination / name
            require(path.is_file() and not path.is_symlink() and path.stat().st_uid == os.geteuid() and path.stat().st_mode & 0o077 == 0, '恢复备份文件归属或权限异常：' + name)
            content = path.read_bytes()
            require(bool(content) and (not name.endswith('.dump') or content.startswith(b'PGDMP') and len(content) > 5), '恢复备份内容缺失或损坏：' + name)
            manifest[name] = hashlib.sha256(content).hexdigest()
        return manifest

    def restore_checkpoint(self, pointer):
        require(not pointer.is_symlink() and pointer.stat().st_uid == os.geteuid() and pointer.stat().st_mode & 0o077 == 0, '卸载检查点归属或权限异常。')
        data = json.loads(pointer.read_text())
        destination = Path(data['archive'])
        require(destination.parent == self.archives and destination.is_dir() and not destination.is_symlink() and destination.stat().st_uid == os.geteuid() and destination.stat().st_mode & 0o077 == 0, '卸载归档归属异常。')
        require(data['checksums'] == self.backup_manifest(destination, data['ready']), '恢复备份完整性校验失败，停止卸载。')
        stored_resources = json.loads((destination / 'resources.json').read_text())
        require(self.identity(stored_resources) == data['ids'], '卸载资源清单与备份不一致。')
        return data, destination

    def uninstall(self):
        self.files_ok()
        pointer = self.base / '.uninstall-checkpoint.json'
        if pointer.exists():
            data, destination = self.restore_checkpoint(pointer)
            ids = data['ids']
            inv, r, _ = self.inspect(True, ids)
        else:
            inv, r, ids = self.inspect(True)
            destination = self.archive('uninstall')
            self.backup(destination, inv, r, ids)
            data = {'ids': ids, 'archive': str(destination), 'ready': False, 'checksums': self.backup_manifest(destination, False)}
            self.checkpoint(data)
        # 重试时重新停止后端并生成最终备份，避免使用后端重启前的 ready 检查点。
        if r['app']:
            require(r['pg'], 'Dokploy 仍存在但数据库已消失，停止处理。')
            self.text('docker', 'service', 'scale', ids['app'] + '=0', timeout=30)
            for _ in range(self.attempts):
                inv, r, _ = self.inspect(True, ids)
                running = [c for c in inv['containers'] if self.labels(c).get('com.docker.swarm.service.id') == ids['app'] and c.get('State', {}).get('Running')]
                if not running:
                    break
                self.sleep(2)
            else:
                raise Refused('等待 Dokploy 停止超时；未删除数据库。')
        if r['pg']:
            # 替换最终备份前先清除旧校验记录，使中途失败后仍能重新生成备份。
            data['ready'] = False
            data['checksums'] = self.backup_manifest(destination, False)
            self.checkpoint(data)
            self.backup(destination, inv, r, ids, final=True)
            data['ready'] = True
            data['checksums'] = self.backup_manifest(destination, True)
            self.checkpoint(data)
        require(data['ready'] and (destination / 'database-final.dump').read_bytes().startswith(b'PGDMP'), '缺少通过校验的最终数据库备份。')
        # 每次移除 Docker 资源前重新核对身份，以及其他应用是否正在引用它。
        for kind, key in [('service', 'app'), ('container', 'entry'), ('service', 'pg')]:
            inv, r, _ = self.inspect(True, ids)
            if r[key]:
                if key == 'app':
                    require(r['app']['Spec']['Mode']['Replicated']['Replicas'] == 0 and not any(self.labels(c).get('com.docker.swarm.service.id') == ids['app'] and c.get('State', {}).get('Running') for c in inv['containers']), '最终备份后 Dokploy 被重新启动，拒绝删除。')
                self.text('docker', kind, 'rm', *(['-f'] if kind == 'container' else []), ids[key], timeout=30)
        for _ in range(self.attempts):
            inv = self.inventory()
            tasks = [c for c in inv['containers'] if self.labels(c).get('com.docker.swarm.service.id') in [ids['app'], ids['pg']]]
            if not tasks:
                break
            self.sleep(2)
        else:
            raise Refused('等待 Dokploy任务清理超时；保留网络、凭据与数据，可重试。')
        for kind, key in [('secret', 'pg_secret'), ('secret', 'auth_secret'), ('network', 'network')]:
            inv, r, _ = self.inspect(True, ids)
            if r[key]:
                self.text('docker', kind, 'rm', ids[key], timeout=30)
        self.files_ok()
        self.link.unlink()
        try:
            os.rename(self.base, destination / 'data')
        except OSError:
            # 归档移动失败时恢复原兼容链接，供下次卸载重试。
            if not self.link.exists() and not self.link.is_symlink():
                self.link.symlink_to(self.base / 'config')
            raise
        return {'status': 'uninstalled', 'archive': str(destination), 'preserved': ['Swarm', 'images', 'other applications', 'KPanel domain proxy']}


def main():
    parser = argparse.ArgumentParser(description=__doc__)
    parser.add_argument('action', choices=['inspect', 'plan-update', 'update', 'plan-uninstall', 'uninstall'])
    args = parser.parse_args()
    require(os.geteuid() == 0, '请以 root 运行。')
    app = Lifecycle()
    app.files_ok()
    lock = app.base / '.lifecycle.lock'
    require(not lock.is_symlink(), '生命周期锁不能是符号链接。')
    with open(lock, 'a') as handle:
        try:
            fcntl.flock(handle, fcntl.LOCK_EX | fcntl.LOCK_NB)
        except BlockingIOError:
            raise Refused('另一个 Dokploy 操作正在运行。')
        if args.action in ['inspect', 'plan-update', 'plan-uninstall']:
            result = app.plan(args.action == 'plan-uninstall')
        else:
            result = getattr(app, args.action)()
        print(json.dumps(result, ensure_ascii=False, indent=2))


if __name__ == '__main__':
    try:
        main()
    except (Refused, OSError, ValueError, KeyError, subprocess.TimeoutExpired) as error:
        print('Dokploy：' + str(error), file=sys.stderr)
        sys.exit(1)
DOKPLOY_LIFECYCLE
}

docker_app_update() {
    dokploy_lifecycle update
}

docker_app_uninstall() {
    dokploy_lifecycle uninstall
}

