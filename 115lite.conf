# --- 基础信息 / Basic Information ---
local app_id="115lite"
local app_name="115Lite Web"
local app_text="115 网盘轻量 Web 管理端"
local app_url="https://115-desktop.feishu.cn/wiki/TGkCwBPoVibFUrkxgh6cvuPAntc"
local docker_name="115lite"
local docker_port="11510"
local app_size="1"

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/115lite"
    local secret_key
    local frontend_url

    # 校验宿主机访问端口
    if [[ ! "${docker_port}" =~ ^[0-9]{1,5}$ ]]; then
        echo "安装失败：端口必须为 1-65535 之间的整数。"
        return 1
    fi

    if (( 10#${docker_port} < 1 || 10#${docker_port} > 65535 )); then
        echo "安装失败：端口必须为 1-65535 之间的整数。"
        return 1
    fi

    # 避免重复安装覆盖原有配置和密钥
    if [[ -e "${app_dir}/docker-compose.yml" || -e "${app_dir}/.env" ]]; then
        echo "检测到已有配置，请使用更新功能，避免覆盖原有配置。"
        return 1
    fi

    # 所有应用持久化数据均位于 /home/docker/115lite
    mkdir -p "${app_dir}/data" "${app_dir}/downloads" || return 1
    cd "${app_dir}" || return 1

    echo "请输入浏览器实际访问本应用的完整地址。"
    echo "示例：http://服务器IP:${docker_port} 或 https://115.example.com"
    echo "使用反向代理时，请填写对外访问的域名地址。"

    while true; do
        read -r -p "访问地址 FRONTEND_URL：" frontend_url || return 1

        # 限制输入字符，避免写入 .env 时发生配置注入
        # 支持常见的 IPv4、域名及 HTTP/HTTPS 地址
        if [[ "${frontend_url}" =~ ^https?://[a-zA-Z0-9._:/-]+$ ]]; then
            frontend_url="${frontend_url%/}"
            break
        fi

        echo "地址格式不正确，请输入 http://IP:端口 或 https://域名。"
    done

    # 从系统随机源生成 32 字节密钥，不依赖 openssl
    secret_key="$(od -An -N32 -tx1 /dev/urandom | tr -d '[:space:]')"

    if [[ ! "${secret_key}" =~ ^[0-9a-f]{64}$ ]]; then
        echo "安装失败：无法生成安全的随机密钥。"
        return 1
    fi

    # .env 含有认证密钥，仅允许当前用户读写
    (
        umask 077
        printf '%s\n' \
            "SECRET_KEY=${secret_key}" \
            "FRONTEND_URL=${frontend_url}" \
            "APP_PORT=${docker_port}" > .env
    ) || return 1

    cat > docker-compose.yml <<'EOF'
name: 115lite

services:
  app:
    image: shimily3/115lite:latest
    container_name: 115lite
    init: true
    ports:
      - "${APP_PORT}:11510"
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
    environment:
      DATABASE_URL: "sqlite:///./data/115lite.db"
      SECRET_KEY: "${SECRET_KEY}"
      FRONTEND_URL: "${FRONTEND_URL}"
      DEBUG: "false"
      TZ: "Asia/Shanghai"
    restart: unless-stopped
EOF

    if [[ $? -ne 0 ]]; then
        echo "安装失败：无法写入 docker-compose.yml。"
        return 1
    fi

    docker compose config --quiet || return 1
    docker compose up -d || return 1

    echo "安装完成。"
    echo "访问地址：${frontend_url}"
    echo "首次访问请初始化管理员账号密码，再使用 115 官方手机客户端扫码登录。"
    echo "数据目录：${app_dir}/data"
    echo "下载目录：${app_dir}/downloads（容器内路径：/downloads）"
    echo "公网部署建议配置 HTTPS，并尽快完成管理员初始化。"

    check_docker_app_ip
}

docker_app_update() {
    local app_dir="/home/docker/115lite"

    if [[ ! -f "${app_dir}/docker-compose.yml" ]]; then
        echo "更新失败：未找到应用配置，请先安装。"
        return 1
    fi

    cd "${app_dir}" || return 1

    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d --remove-orphans || return 1

    echo "更新完成，原有数据和配置已保留。"
}

docker_app_uninstall() {
    local app_dir="/home/docker/115lite"

    # 配置缺失时不直接删除数据，避免遗留正在运行的容器
    if [[ ! -f "${app_dir}/docker-compose.yml" ]]; then
        echo "卸载失败：未找到 Compose 配置。"
        echo "请先检查容器状态和 ${app_dir}，避免误删数据。"
        return 1
    fi

    cd "${app_dir}" || return 1

    # 停止并删除容器、网络和相关镜像
    # 失败时保留目录，方便排查和重试
    docker compose down --rmi all --remove-orphans || return 1

    cd / || return 1

    # 彻底删除数据库、配置和下载文件
    rm -rf -- "${app_dir}" || return 1

    echo "卸载完成，应用数据、配置及下载文件已全部删除。"
}

# --- 注册（必须包含）/ Registration (Mandatory) ---
docker_app_plus
