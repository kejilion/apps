# Transmission for kejilion/apps
# Official: https://transmissionbt.com/
# Image documentation: https://docs.linuxserver.io/images/docker-transmission/

local app_id="transmission"
local app_name="Transmission"
local app_text="轻量开源的 BT / 磁力下载工具，提供 Web 管理、限速和种子监视目录"
local app_url="https://transmissionbt.com/"
local docker_name="transmission"
local docker_port="9091"
local app_size="1"

transmission_owned_dir() {
    local app_dir="/home/docker/transmission" entry
    if [ -L /home/docker ] || [ -L "$app_dir" ] ||
       [ ! -f "$app_dir/.kejilion-app" ] || [ -L "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app" 2>/dev/null)" != "transmission" ]; then
        echo "未找到 Transmission 的安装记录，拒绝操作已有目录" >&2
        return 1
    fi
    for entry in .env docker-compose.yml config downloads watch; do
        if [ -L "$app_dir/$entry" ]; then
            echo "应用文件或数据目录是符号链接，拒绝操作: $entry" >&2
            return 1
        fi
    done
}

transmission_wait_ready() {
    local attempt web_port status
    web_port="$(sed -n 's/^TRANSMISSION_WEB_PORT=//p' .env)"
    for attempt in $(seq 1 30); do
        status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 \
            "http://127.0.0.1:${web_port}/transmission/web/")"
        if [ "$status" = "401" ]; then
            return 0
        fi
        sleep 2
    done
    echo "Web 启动或登录保护检查未通过，配置和下载数据已保留。请查看 docker logs $docker_name 后重试。" >&2
    return 1
}

docker_app_install() {
    local app_dir="/home/docker/transmission"
    local peer_port="${TRANSMISSION_PEER_PORT:-51413}" password

    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入" >&2
        return 1
    fi
    if [ -e "$app_dir" ]; then
        transmission_owned_dir || return 1
        if [ -f "$app_dir/.env" ] && [ -f "$app_dir/docker-compose.yml" ]; then
            docker_app_update
            return $?
        fi
        echo "安装目录不完整，请检查后重试；不会覆盖已有配置" >&2
        return 1
    fi
    if docker container inspect "$docker_name" >/dev/null 2>&1; then
        echo "同名容器已存在，拒绝覆盖" >&2
        return 1
    fi
    if ! [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] ||
       [ "$docker_port" -gt 65535 ] ||
       ! [[ "$peer_port" =~ ^[1-9][0-9]{0,4}$ ]] ||
       [ "$peer_port" -gt 65535 ] || [ "$docker_port" = "$peer_port" ]; then
        echo "Web / BT 端口必须为不同的 1-65535 整数" >&2
        return 1
    fi
    password="$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" || return 1
    [ ${#password} -eq 48 ] || return 1

    mkdir -m 700 -- "$app_dir" || return 1
    printf '%s\n' transmission > "$app_dir/.kejilion-app" || return 1
    mkdir -p "$app_dir/config" "$app_dir/downloads" "$app_dir/watch" || return 1
    chown 1000:1000 "$app_dir/config" "$app_dir/downloads" "$app_dir/watch" || return 1
    (umask 077; cat > "$app_dir/.env" <<EOF
TRANSMISSION_WEB_PORT=${docker_port}
TRANSMISSION_PEER_PORT=${peer_port}
TRANSMISSION_USER=admin
TRANSMISSION_PASS=${password}
EOF
    ) || return 1
    cat > "$app_dir/docker-compose.yml" <<'EOF'
services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      USER: ${TRANSMISSION_USER:?missing username}
      PASS: ${TRANSMISSION_PASS:?missing password}
      PEERPORT: ${TRANSMISSION_PEER_PORT:?missing BT port}
    ports:
      - "${TRANSMISSION_WEB_PORT}:9091"
      - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}"
      - "${TRANSMISSION_PEER_PORT}:${TRANSMISSION_PEER_PORT}/udp"
    volumes:
      - ./config:/config
      - ./downloads:/downloads
      - ./watch:/watch
EOF
    cd "$app_dir" || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    transmission_wait_ready || return 1
    echo "Transmission 安装完成，Web 登录账号: admin"
    echo "初始随机密码保存在 $app_dir/.env 的 TRANSMISSION_PASS，请在服务器本机查看。"
    check_docker_app_ip
    echo "下载目录: $app_dir/downloads；种子监视目录: $app_dir/watch"
    echo "BT 连接端口: $peer_port (TCP/UDP)，请按需放行该端口。"
}

docker_app_update() {
    transmission_owned_dir || return 1
    cd /home/docker/transmission || return 1
    [ -f .env ] && [ -f docker-compose.yml ] || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    transmission_wait_ready || return 1
    echo "Transmission 更新完成，原有账号、配置和下载数据已保留。"
}

docker_app_uninstall() {
    transmission_owned_dir || return 1
    cd /home/docker/transmission || return 1
    [ -f docker-compose.yml ] || return 1
    docker compose down --rmi all || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/transmission || return 1
    echo "Transmission 已卸载，配置和下载数据已清理。"
}

docker_app_plus
