# Official deployment: https://artalk.js.org/guide/deploy.html
local app_id="artalk"
local app_name="Artalk"
local app_text="自托管网站评论系统，支持评论审核与多站点管理"
local app_url="https://artalk.js.org/"
local docker_name="artalk"
local docker_port="23366"
local app_size="1"

artalk_open_installation() {
    local app_dir="/home/docker/artalk" path
    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "Artalk 安装目录不能是符号链接。" >&2
        return 1
    fi
    for path in .kejilion-app docker-compose.yml .env data; do
        if [ -L "$app_dir/$path" ]; then
            echo "拒绝操作 Artalk 符号链接: $path" >&2
            return 1
        fi
    done
    if [ ! -f "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app")" != artalk ] ||
       [ ! -f "$app_dir/docker-compose.yml" ] ||
       [ ! -f "$app_dir/.env" ] || [ ! -d "$app_dir/data" ]; then
        echo "未找到完整的 kejilion.sh Artalk 安装，现有文件已保留。" >&2
        return 1
    fi
    cd "$app_dir"
}

artalk_start() {
    local port attempt
    port="$(sed -n 's/^APP_PORT=//p' .env)"
    if ! [[ "$port" =~ ^[1-9][0-9]{0,4}$ ]] || [ "$port" -gt 65535 ]; then
        echo "Artalk 端口必须是 1–65535 的整数。" >&2
        return 1
    fi
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    for attempt in {1..30}; do
        if curl -fsS --max-time 2 -o /dev/null "http://127.0.0.1:$port/"; then
            local docker_port="$port"
            check_docker_app_ip
            return 0
        fi
        sleep 2
    done
    echo "Artalk 启动检查失败，数据已保留。请运行 docker compose logs 查看原因。" >&2
    return 1
}

docker_app_install() {
    local app_dir="/home/docker/artalk"
    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "Artalk 安装目录不能是符号链接。" >&2
        return 1
    fi
    if [ -e "$app_dir" ]; then
        artalk_open_installation || return 1
        if [ "$(sed -n 's/^APP_PORT=//p' .env)" != "$docker_port" ]; then
            echo "Artalk 已有安装，重试时请沿用 .env 中的 APP_PORT。" >&2
            return 1
        fi
    else
        if docker container inspect artalk >/dev/null 2>&1; then
            echo "同名 Artalk 容器已存在。" >&2
            return 1
        fi
        if ! [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] || [ "$docker_port" -gt 65535 ]; then
            echo "Artalk 端口必须是 1–65535 的整数。" >&2
            return 1
        fi
        mkdir -p /home/docker && mkdir -m 700 "$app_dir" && cd "$app_dir" || return 1
        mkdir -m 700 data || return 1
        printf 'APP_PORT=%s\n' "$docker_port" > .env || return 1
        cat > docker-compose.yml <<'EOF' || return 1
services:
  artalk:
    image: artalk/artalk-go:latest
    container_name: artalk
    restart: unless-stopped
    ports:
      - "${APP_PORT}:23366"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      ATK_LOCALE: zh-CN
EOF
        printf '%s\n' artalk > .kejilion-app || return 1
    fi
    artalk_start || return 1
    echo "请在服务器终端运行 docker exec -it artalk artalk admin 创建管理员，然后在后台设置网站地址。"
}

docker_app_update() {
    artalk_open_installation && artalk_start || return 1
    echo "Artalk 更新完成，评论和配置仍保存在 /home/docker/artalk/data。"
}

docker_app_uninstall() {
    artalk_open_installation || return 1
    docker compose down --rmi all || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/artalk || return 1
    echo "Artalk 已卸载，应用数据已清理。"
}

docker_app_plus
