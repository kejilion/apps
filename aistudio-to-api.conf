# --- 基础信息 / Basic Information ---
local app_id="aistudio-to-api" # 和文件名一致，用于安装状态检测 / Same as the filename, used for installation status detection.
local app_name="AIStudioToAPI" # 应用显示名称
local app_text="将 Google AI Studio Build 封装为 OpenAI、Gemini、Anthropic 兼容 API" # 一句话简介
local app_url="https://github.com/iBUHub/AIStudioToAPI" # 官网链接
local docker_name="aistudio-to-api" # 容器启动后的名称
local docker_port="7891" # 默认访问端口
local app_size="2" # 占用空间大小(GB)

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    mkdir -p /home/docker/aistudio-to-api/{auth,data} && cd /home/docker/aistudio-to-api

    # 首次安装时生成独立的访问凭据，避免使用项目默认凭据。
    if [ ! -f .env ]; then
        local api_key
        local console_password
        api_key=$(od -An -N 24 -tx1 /dev/urandom | tr -d ' \n')
        console_password=$(od -An -N 24 -tx1 /dev/urandom | tr -d ' \n')

        cat > .env <<EOF
# 由安装程序自动生成；请妥善保存并按需修改。
API_KEYS=${api_key}
WEB_CONSOLE_PASSWORD=${console_password}
TZ=Asia/Shanghai
MAX_CONTEXTS=1
SECURE_COOKIES=false
EOF
    fi

    cat > docker-compose.yml <<EOF
services:
  aistudio-to-api:
    image: ibuhub/aistudio-to-api:latest
    container_name: aistudio-to-api
    restart: unless-stopped
    ports:
      - "${docker_port}:7860"
    env_file:
      - .env
    volumes:
      - ./auth:/app/configs/auth
      - ./data:/app/data
EOF

    docker compose up -d

    echo ""
    echo "========================================"
    echo "  安装完成 / Install Complete"
    echo "========================================"
    echo "  API 密钥与控制台密码已保存至："
    echo "  /home/docker/aistudio-to-api/.env"
    echo "  请立即妥善保存并按需修改。"
    echo "  首次使用请在 Web 控制台添加 Google 账号。"
    echo "========================================"
    echo ""

    check_docker_app_ip
}

docker_app_update() {
    cd /home/docker/aistudio-to-api
    docker compose pull
    docker compose up -d
    echo "更新完成 / Update Complete"
}

docker_app_uninstall() {
    cd /home/docker/aistudio-to-api
    docker compose down --rmi all
    rm -rf /home/docker/aistudio-to-api
    echo "卸载完成 / Uninstall Complete"
}

# --- 注册 (必须包含) / Registration (Mandatory) ---
docker_app_plus
