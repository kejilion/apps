# Official: https://docmost.com/
# Tested stable version; set APP_IMAGE in .env to upgrade deliberately after backup.
local app_id="docmost"
local app_name="Docmost"
local app_text="团队文档与知识库，支持空间、富文本和实时编辑，内置独立数据库与缓存"
local app_url="https://docmost.com/"
local docker_name="docmost"
local docker_port="3000"
local app_size="2"

docmost_owned_dir() {
    local app_dir="/home/docker/docmost" entry
    if [ -L /home/docker ] || [ -L "$app_dir" ] ||
       [ ! -f "$app_dir/.kejilion-app" ] || [ -L "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app" 2>/dev/null)" != "docmost" ]; then
        echo "未找到 Docmost 安装记录，拒绝操作已有目录" >&2
        return 1
    fi
    for entry in .env docker-compose.yml .initialized data extensions postgres redis storage; do
        [ ! -L "$app_dir/$entry" ] || { echo "拒绝操作符号链接: $entry" >&2; return 1; }
    done
}

docmost_wait_ready() {
    local attempt web_port status
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    for attempt in $(seq 1 60); do
        status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:${web_port}/")"
        case "$status" in 200|302|303) return 0 ;; esac
        sleep 2
    done
    echo "Docmost 启动检查失败，配置和数据已保留，请查看 docker compose logs。" >&2
    return 1
}

docmost_finish_setup() {
    local password web_port response
    [ -f .initialized ] && return 0
    password="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)"
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    [[ "$password" =~ ^[a-f0-9]{48}$ ]] || return 1
    response="$(curl -fsS --max-time 60 -H 'Content-Type: application/json' --data "{\"name\":\"Owner\",\"workspaceName\":\"My Workspace\",\"email\":\"admin@example.com\",\"password\":\"${password}\"}" "http://127.0.0.1:${web_port}/api/auth/setup")" || return 1
    printf '%s' "$response" | grep -Eq '"id"[[:space:]]*:' || return 1
    sed -i 's/^APP_BIND=127.0.0.1$/APP_BIND=0.0.0.0/' .env || return 1

    docker compose up -d || return 1
    docmost_wait_ready || return 1
    (umask 077; printf '%s\n' initialized > .initialized)
}

docker_app_install() {
    local app_dir="/home/docker/docmost" password secret
    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入" >&2; return 1
    fi
    if [ -e "$app_dir" ]; then
        docmost_owned_dir || return 1
        if [ -f "$app_dir/.env" ] && [ -f "$app_dir/docker-compose.yml" ]; then
            docker_app_update; return $?
        fi
        echo "已有目录不完整，请检查后重试；不会覆盖配置。" >&2; return 1
    fi
    if docker container inspect "$docker_name" >/dev/null 2>&1; then
        echo "同名容器已存在，拒绝覆盖" >&2; return 1
    fi
    if ! [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] || [ "$docker_port" -gt 65535 ]; then
        echo "端口必须为 1-65535 整数" >&2; return 1
    fi
    password="$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" || return 1
    secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" || return 1
    [ ${#password} -eq 48 ] && [ ${#secret} -eq 64 ] || return 1
    mkdir -p /home/docker || return 1
    mkdir -m 700 -- "$app_dir" || return 1
    printf '%s\n' docmost > "$app_dir/.kejilion-app" || return 1
    mkdir -p "$app_dir/storage" "$app_dir/postgres" "$app_dir/redis" || return 1
    (umask 077; cat > "$app_dir/.env" <<EOF
APP_PORT=${docker_port}
COMPOSE_PROJECT_NAME=kejilion-docmost
APP_BIND=127.0.0.1
APP_IMAGE=docmost/docmost:0.96.0
ADMIN_PASSWORD=${password}
APP_SECRET=${secret}
APP_URL=http://localhost:${docker_port}
EOF
    ) || return 1
    cat > "$app_dir/docker-compose.yml" <<'EOF'
services:
  app:
    image: docmost/docmost:0.96.0
    container_name: docmost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL}
      APP_SECRET: ${APP_SECRET:?missing secret}
      DATABASE_URL: postgresql://docmost:${ADMIN_PASSWORD:?missing DB password}@db:5432/docmost
      REDIS_URL: redis://redis:6379
    ports:
      - '${APP_BIND}:${APP_PORT}:3000'
    volumes:
      - ./storage:/app/data/storage
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${ADMIN_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmost -d docmost']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./postgres:/var/lib/postgresql
  redis:
    image: redis:8
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./redis:/data
EOF
    cd "$app_dir" || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    docmost_wait_ready || return 1
    docmost_finish_setup || { echo "初始化未完成，服务保留在本机；请检查日志后重试。" >&2; return 1; }
    echo "Docmost 安装完成。登录邮箱: admin@example.com"
    echo "初始密码保存在 $app_dir/.env 的 ADMIN_PASSWORD，请在服务器本机查看。"
    check_docker_app_ip
    echo "请将 .env 的 APP_URL 改为实际访问地址（建议 HTTPS 域名），再执行 docker compose up -d。"
    echo "数据位于 $app_dir；备份前请 docker compose stop 并复制整个目录，完成后再启动。"
}

docker_app_update() {
    docmost_owned_dir || return 1
    cd /home/docker/docmost || return 1
    [ -f .env ] && [ -f docker-compose.yml ] || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    docmost_wait_ready || return 1
    docmost_finish_setup || return 1
    echo "Docmost 更新完成，账号与数据已保留。镜像版本由 .env 的 APP_IMAGE 控制；升级版本前请备份。"
}

docker_app_uninstall() {
    docmost_owned_dir || return 1
    cd /home/docker/docmost || return 1
    [ -f docker-compose.yml ] || return 1
    docker compose down || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/docmost || return 1
    echo "Docmost 已卸载，应用数据已清理。"
}

docker_app_plus
