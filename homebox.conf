# Official: https://homebox.software/
# Tested stable version; set APP_IMAGE in .env to upgrade deliberately after backup.
local app_id="homebox"
local app_name="HomeBox"
local app_text="家庭物品管理，记录位置、标签、购买资料和保修信息，支持搜索"
local app_url="https://homebox.software/"
local docker_name="homebox"
local docker_port="3100"
local app_size="1"

homebox_owned_dir() {
    local app_dir="/home/docker/homebox" entry
    if [ -L /home/docker ] || [ -L "$app_dir" ] ||
       [ ! -f "$app_dir/.kejilion-app" ] || [ -L "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app" 2>/dev/null)" != "homebox" ]; then
        echo "未找到 HomeBox 安装记录，拒绝操作已有目录" >&2
        return 1
    fi
    for entry in .env docker-compose.yml .initialized data extensions postgres redis storage; do
        [ ! -L "$app_dir/$entry" ] || { echo "拒绝操作符号链接: $entry" >&2; return 1; }
    done
}

homebox_wait_ready() {
    local attempt web_port status
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    for attempt in $(seq 1 60); do
        status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:${web_port}/")"
        case "$status" in 200|302|303) return 0 ;; esac
        sleep 2
    done
    echo "HomeBox 启动检查失败，配置和数据已保留，请查看 docker compose logs。" >&2
    return 1
}

homebox_finish_setup() {
    local password web_port response
    [ -f .initialized ] && return 0
    password="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)"
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    [[ "$password" =~ ^[a-f0-9]{48}$ ]] || return 1
    curl -fsS --max-time 30 -o /dev/null -H 'Content-Type: application/json' --data "{\"name\":\"Owner\",\"email\":\"admin@example.com\",\"password\":\"${password}\"}" "http://127.0.0.1:${web_port}/api/v1/users/register" || return 1
    sed -i 's/^APP_BIND=127.0.0.1$/APP_BIND=0.0.0.0/' .env || return 1
    sed -i 's/^ALLOW_REGISTRATION=true$/ALLOW_REGISTRATION=false/' .env || return 1
    docker compose up -d || return 1
    homebox_wait_ready || return 1
    (umask 077; printf '%s\n' initialized > .initialized)
}

docker_app_install() {
    local app_dir="/home/docker/homebox" password secret
    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入" >&2; return 1
    fi
    if [ -e "$app_dir" ]; then
        homebox_owned_dir || return 1
        if [ -f "$app_dir/.env" ] && [ -f "$app_dir/docker-compose.yml" ]; then
            docker_app_update; return $?
        fi
        echo "已有目录不完整，请检查后重试；不会覆盖配置。" >&2; return 1
    fi
    if docker container inspect "$docker_name" >/dev/null 2>&1; then
        echo "同名容器已存在，拒绝覆盖" >&2; return 1
    fi
    if ! [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] || [ "$docker_port" -gt 65535 ]; then
        echo "端口必须为 1-65535 整数" >&2; return 1
    fi
    password="$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" || return 1
    secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" || return 1
    [ ${#password} -eq 48 ] && [ ${#secret} -eq 64 ] || return 1
    mkdir -p /home/docker || return 1
    mkdir -m 700 -- "$app_dir" || return 1
    printf '%s\n' homebox > "$app_dir/.kejilion-app" || return 1
    mkdir -p "$app_dir/data" || return 1
    (umask 077; cat > "$app_dir/.env" <<EOF
APP_PORT=${docker_port}
COMPOSE_PROJECT_NAME=kejilion-homebox
APP_BIND=127.0.0.1
APP_IMAGE=ghcr.io/sysadminsmedia/homebox:0.26.2
ADMIN_PASSWORD=${password}
APP_SECRET=${secret}
ALLOW_REGISTRATION=true
EOF
    ) || return 1
    cat > "$app_dir/docker-compose.yml" <<'EOF'
services:
  app:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    container_name: homebox
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      HBOX_OPTIONS_ALLOW_REGISTRATION: ${ALLOW_REGISTRATION}
      HBOX_AUTH_API_KEY_PEPPER: ${APP_SECRET:?missing stable API key secret}
    ports:
      - '${APP_BIND}:${APP_PORT}:7745'
    volumes:
      - ./data:/data
EOF
    cd "$app_dir" || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    homebox_wait_ready || return 1
    homebox_finish_setup || { echo "初始化未完成，服务保留在本机；请检查日志后重试。" >&2; return 1; }
    echo "HomeBox 安装完成。登录邮箱: admin@example.com；公开注册已关闭。"
    echo "初始密码保存在 $app_dir/.env 的 ADMIN_PASSWORD，请在服务器本机查看。"
    check_docker_app_ip
    echo "首次使用：集合 → 实体类型 → Create，建立一个非容器的物品类型，再从创建菜单录入物品。"
    echo "数据位于 $app_dir；备份前请 docker compose stop 并复制整个目录，完成后再启动。"
}

docker_app_update() {
    homebox_owned_dir || return 1
    cd /home/docker/homebox || return 1
    [ -f .env ] && [ -f docker-compose.yml ] || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    homebox_wait_ready || return 1
    homebox_finish_setup || return 1
    echo "HomeBox 更新完成，账号与数据已保留。镜像版本由 .env 的 APP_IMAGE 控制；升级版本前请备份。"
}

docker_app_uninstall() {
    homebox_owned_dir || return 1
    cd /home/docker/homebox || return 1
    [ -f docker-compose.yml ] || return 1
    docker compose down || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/homebox || return 1
    echo "HomeBox 已卸载，应用数据已清理。"
}

docker_app_plus
