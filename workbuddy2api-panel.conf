# WorkBuddy2API Panel - WorkBuddy / CodeBuddy account pool gateway
local app_id="workbuddy2api-panel"
local app_name="WorkBuddy2API Panel"
local app_text="WorkBuddy / CodeBuddy 多账号池 API 网关，兼容 OpenAI / Anthropic，带 Web 面板、任务、生图、视频与 MCP（仅本机监听）"
local app_url="https://github.com/haohaomin/workbuddy2api-panel"
local docker_name="workbuddy2api-panel"
local docker_port="7863"
local app_size="2"

workbuddy2api_panel_dir() {
    printf '%s\n' /home/docker/workbuddy2api-panel
}

workbuddy2api_panel_deploy() {
    local app_dir port base key
    app_dir="$(workbuddy2api_panel_dir)"
    port="$1"
    if ! [[ "$port" =~ ^[0-9]+$ ]] || [ "$port" -lt 1 ] || [ "$port" -gt 65535 ]; then
        echo "端口无效: $port" >&2
        return 1
    fi
    base="${gh_proxy:-https://}"
    mkdir -p "$app_dir/auths" "$app_dir/data" || return 1
    cd "$app_dir" || return 1
    curl -fsSL --retry 2 -o docker-compose.yml "${base}raw.githubusercontent.com/haohaomin/workbuddy2api-panel/main/docker-compose.yml" || return 1
    curl -fsSL --retry 2 -o config.json "${base}raw.githubusercontent.com/haohaomin/workbuddy2api-panel/main/config.example.json" || return 1
    key="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
    [ -n "$key" ] || return 1
    sed -i "s/test_key/$key/" config.json || return 1
    sed -i "s/7863:7863/127.0.0.1:${port}:7863/" docker-compose.yml || return 1
    sed -i "s/container_name: workbuddy2api/container_name: workbuddy2api-panel/" docker-compose.yml || return 1
    grep -q "127.0.0.1:${port}:7863" docker-compose.yml || return 1
    chown -R 10001:10001 auths data config.json 2>/dev/null || true
    chmod 600 config.json || return 1
    printf 'API_KEY=%s\n' "$key" > .credentials || return 1
    chmod 600 .credentials || return 1
    docker compose up -d || return 1
    echo "管理面板: http://127.0.0.1:${port}/panel/"
    echo "API Key 保存在 $app_dir/.credentials"
    echo "公网访问请通过 kejilion.sh HTTPS 反向代理，不要直接开放端口"
}

docker_app_install() {
    local app_dir
    app_dir="$(workbuddy2api_panel_dir)"
    if [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝安装" >&2
        return 1
    fi
    if [ -e "$app_dir" ] && [ ! -f "$app_dir/.kejilion-app" ]; then
        echo "目录已存在且不属于本应用: $app_dir" >&2
        return 1
    fi
    mkdir -p "$app_dir" || return 1
    : > "$app_dir/.kejilion-app" || return 1
    workbuddy2api_panel_deploy "${docker_port}" || return 1
}

docker_app_update() {
    local app_dir port
    app_dir="$(workbuddy2api_panel_dir)"
    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ] || [ ! -f "$app_dir/.credentials" ]; then
        echo "未找到本应用的安装记录，拒绝更新" >&2
        return 1
    fi
    port="${docker_port}"
    if [ -f /home/docker/workbuddy2api-panel_port.conf ]; then
        port="$(cat /home/docker/workbuddy2api-panel_port.conf)" || return 1
    fi
    cd "$app_dir" || return 1
    sed -i "s/127.0.0.1:[0-9]*:7863/127.0.0.1:${port}:7863/" docker-compose.yml || return 1
    docker compose pull || return 1
    docker compose up -d
}

docker_app_uninstall() {
    local app_dir
    app_dir="$(workbuddy2api_panel_dir)"
    if [ -L "$app_dir" ] || [ ! -f "$app_dir/.kejilion-app" ]; then
        echo "安装目录不属于本应用，拒绝卸载" >&2
        return 1
    fi
    cd "$app_dir" || return 1
    docker compose down --rmi all || return 1
    cd / || return 1
    rm -rf -- "$app_dir" || return 1
    echo "WorkBuddy2API Panel 已卸载"
}

docker_app_plus
