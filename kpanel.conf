# shellcheck shell=bash disable=SC2034,SC2168
# --- 基础信息 / Basic Information ---
local app_id="kpanel"
local app_name="KPanel"
local app_text="完全贴合 kejilion.sh 业务的现代化 Linux Web 管理面板"
local app_url="https://hub.docker.com/r/kjlion/kejilion-panel"
local docker_name="kejilion-panel"
local docker_port="8080"
local app_size="1"

kpanel_write_compose() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:0.14.0"
    local panel_gid="$1"

    cat <<EOF > "${app_dir}/docker-compose.yml"
services:
  panel:
    image: ${panel_image}
    container_name: kejilion-panel
    restart: unless-stopped
    user: "65532:65532"
    group_add:
      - "${panel_gid}"
    read_only: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "${docker_port}:8080"
    environment:
      KEJILION_PANEL_LISTEN: ":8080"
      KEJILION_PANEL_DATA_DIR: /var/lib/kejilion-panel
      KEJILION_PANEL_AGENT_SOCKET: /run/kejilion-panel/agent.sock
      KEJILION_PANEL_AGENT_TOKEN_FILE: /run/secrets/agent-token
      KEJILION_PANEL_WEB_ROOT: /app/web
      KEJILION_PANEL_PUBLIC_URL: \${KPANEL_PUBLIC_URL}
      KEJILION_PANEL_SECURE_COOKIE: "false"
      KEJILION_PANEL_TRUSTED_PROXY_CIDRS: \${KPANEL_TRUSTED_PROXY_CIDRS}
    volumes:
      - ./data/panel:/var/lib/kejilion-panel
      - ./run:/run/kejilion-panel:ro
      - ./secrets/agent.token:/run/secrets/agent-token:ro
    networks:
      - kpanel
    healthcheck:
      test: ["CMD", "/paneld", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kpanel:
    name: kejilion-panel-network
EOF
}

kpanel_write_agent_service() {
    local app_dir="/home/docker/kpanel"

    cat <<EOF > "${app_dir}/kejilion-agent.service"
[Unit]
Description=KPanel Host Agent
Documentation=https://hub.docker.com/r/kjlion/kejilion-panel
After=local-fs.target docker.service

[Service]
Type=simple
User=root
Group=kejilion-panel
EnvironmentFile=${app_dir}/agent.env
ExecStart=${app_dir}/bin/kejilion-agent
Restart=on-failure
RestartSec=3s
UMask=0077

NoNewPrivileges=true
CapabilityBoundingSet=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE
AmbientCapabilities=CAP_SYS_ADMIN CAP_SYS_MODULE CAP_NET_ADMIN CAP_SYS_RESOURCE
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=false
ProtectKernelLogs=true
ProtectKernelModules=false
ProtectKernelTunables=false
ProtectProc=default
ProtectSystem=strict
ProtectHome=read-only
ReadOnlyPaths=${app_dir}/data/panel
ReadWritePaths=${app_dir} /home/docker /etc -/home/web/conf.d -/home/web/html
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
SystemCallFilter=@system-service @module @swap sethostname
SystemCallErrorNumber=EPERM

[Install]
WantedBy=multi-user.target
EOF

    cat <<EOF > "${app_dir}/agent.env"
KEJILION_AGENT_SOCKET=${app_dir}/run/agent.sock
KEJILION_AGENT_TOKEN_FILE=${app_dir}/secrets/agent.token
KEJILION_AGENT_STATE_DIR=${app_dir}/data/agent
KEJILION_WEB_ROOT=/home/web
KEJILION_DOCKER_SOCKET=/var/run/docker.sock
KEJILION_DOCKER_PID_FILE=/run/docker.pid
KEJILION_DOCKER_ALLOW_SOCKET_ACTIVATION=false
KEJILION_SYSTEM_WRITES_ENABLED=true
KEJILION_PUBLIC_NETWORK_LOOKUP_ENABLED=true
EOF
    chmod 600 "${app_dir}/agent.env"
}

kpanel_extract_agent() {
    local image="$1"
    local destination="$2"
    local release_container="kpanel-release-$$-$RANDOM"

    docker create --name "${release_container}" "${image}" >/dev/null || return 1
    if ! docker cp "${release_container}:/release/kejilion-agent" "${destination}"; then
        docker rm -f "${release_container}" >/dev/null 2>&1
        return 1
    fi
    docker rm "${release_container}" >/dev/null || return 1
    chmod 755 "${destination}"
    [ "$("${destination}" version 2>/dev/null)" = "0.14.0 v1alpha1" ] || {
        echo "Agent 版本校验失败，拒绝继续。"
        rm -f "${destination}"
        return 1
    }
}

kpanel_wait_ready() {
    local app_dir="/home/docker/kpanel"
    local attempt=0
    while [ "${attempt}" -lt 30 ]; do
        if KEJILION_AGENT_SOCKET="${app_dir}/run/agent.sock" \
            KEJILION_AGENT_TOKEN_FILE="${app_dir}/secrets/agent.token" \
            "${app_dir}/bin/kejilion-agent" healthcheck >/dev/null 2>&1 &&
            [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' kejilion-panel 2>/dev/null)" = "healthy" ]; then
            return 0
        fi
        attempt=$((attempt + 1))
        sleep 2
    done
    return 1
}

kpanel_cleanup_failed_install() {
    local app_dir="/home/docker/kpanel"
    local remove_group="${1:-false}"

    if [ -f "${app_dir}/docker-compose.yml" ]; then
        (
            cd "${app_dir}" &&
                docker compose --env-file .env down >/dev/null 2>&1
        ) || true
    fi
    systemctl disable --now kejilion-agent.service >/dev/null 2>&1 || true
    if [ -L /etc/systemd/system/kejilion-agent.service ] &&
        [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "${app_dir}/kejilion-agent.service" ]; then
        rm -f /etc/systemd/system/kejilion-agent.service
    fi
    systemctl daemon-reload >/dev/null 2>&1 || true
    rm -rf "${app_dir}"
    if [ "${remove_group}" = true ]; then
        groupdel kejilion-panel >/dev/null 2>&1 || true
    fi
}

# --- 核心逻辑 / Core Logic ---
docker_app_install() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:0.14.0"
    local panel_gid=""
    local public_ip="${ipv4_address:-}"
    local public_host=""
    local network_subnet=""
    local group_created=false

    [ "$(id -u)" -eq 0 ] || {
        echo "KPanel 安装需要 root 权限。"
        return 1
    }
    command -v systemctl >/dev/null 2>&1 && [ -d /run/systemd/system ] || {
        echo "KPanel Host Agent 需要 systemd，当前系统不支持。"
        return 1
    }
    if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
        echo "请先安装 Docker 与 Docker Compose 插件。"
        return 1
    fi
    [ "$(uname -m)" = "x86_64" ] || [ "$(uname -m)" = "aarch64" ] || [ "$(uname -m)" = "arm64" ] || {
        echo "KPanel 当前仅支持 amd64 与 arm64。"
        return 1
    }
    [ ! -e "${app_dir}" ] && [ ! -e /etc/systemd/system/kejilion-agent.service ] || {
        echo "检测到既有 KPanel 或 Agent，请使用更新功能，避免覆盖现有业务。"
        return 1
    }
    [ -z "$(docker ps -a --filter name='^/kejilion-panel$' --format '{{.Names}}')" ] || {
        echo "检测到同名容器，拒绝覆盖。"
        return 1
    }
    ! docker network inspect kejilion-panel-network >/dev/null 2>&1 || {
        echo "检测到同名 Docker 网络，拒绝覆盖。"
        return 1
    }
    [[ "${docker_port}" =~ ^[0-9]+$ ]] && [ "${docker_port}" -ge 1 ] && [ "${docker_port}" -le 65535 ] || {
        echo "端口必须是 1-65535 的整数。"
        return 1
    }

    if ! getent group kejilion-panel >/dev/null 2>&1; then
        groupadd --system kejilion-panel || return 1
        group_created=true
    fi
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }

    if ! mkdir -p "${app_dir}/bin" "${app_dir}/data/panel" "${app_dir}/data/agent" \
        "${app_dir}/run" "${app_dir}/secrets"
    then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    if ! chown -R 65532:65532 "${app_dir}/data/panel" ||
        ! chown -R root:"${panel_gid}" "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chmod 750 "${app_dir}" "${app_dir}/bin" "${app_dir}/data" \
            "${app_dir}/data/agent" "${app_dir}/run" "${app_dir}/secrets" ||
        ! chmod 700 "${app_dir}/data/panel"; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! docker pull "${panel_image}" ||
        ! kpanel_extract_agent "${panel_image}" "${app_dir}/bin/kejilion-agent" ||
        ! kpanel_write_compose "${panel_gid}" ||
        ! kpanel_write_agent_service; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if [ -z "${public_ip}" ]; then
        public_ip="$(curl -4 -fsS --max-time 8 https://api.ipify.org 2>/dev/null || true)"
    fi
    if [ -z "${public_ip}" ]; then
        public_ip="$(hostname -I 2>/dev/null | awk '{print $1}')"
    fi
    [ -n "${public_ip}" ] || {
        echo "无法确定服务器 IP，拒绝生成不安全的公开地址。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    case "${public_ip}" in
        *[!0-9a-fA-F:.]*)
            echo "服务器 IP 格式无效，拒绝继续。"
            kpanel_cleanup_failed_install "${group_created}"
            return 1
            ;;
        *:*)
            public_host="[${public_ip}]"
            ;;
        *)
            public_host="${public_ip}"
            ;;
    esac

    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128
EOF
    chmod 600 "${app_dir}/.env"

    cd "${app_dir}" || {
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    if ! docker compose --env-file .env create; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi
    network_subnet="$(docker network inspect --format '{{(index .IPAM.Config 0).Subnet}}' kejilion-panel-network 2>/dev/null)"
    [ -n "${network_subnet}" ] || {
        echo "无法识别 KPanel Docker 网络，安装已停止。"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    }
    cat <<EOF > "${app_dir}/.env"
KPANEL_PUBLIC_URL=http://${public_host}:${docker_port}
KPANEL_TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128,${network_subnet}
EOF
    chmod 600 "${app_dir}/.env"

    if ! systemctl link "${app_dir}/kejilion-agent.service" >/dev/null ||
        ! systemctl daemon-reload ||
        ! systemctl enable --now kejilion-agent.service ||
        ! docker compose --env-file .env up -d --force-recreate; then
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    if ! kpanel_wait_ready; then
        echo "KPanel 健康检查失败，请运行：systemctl status kejilion-agent"
        kpanel_cleanup_failed_install "${group_created}"
        return 1
    fi

    echo "KPanel 安装完成 / Install Complete"
    check_docker_app_ip
    echo "首次初始化 Token 文件：${app_dir}/data/panel/bootstrap.token"
    echo "添加 HTTPS 域名：k fd panel.example.com 127.0.0.1 ${docker_port}"
}

docker_app_update() {
    local app_dir="/home/docker/kpanel"
    local panel_image="docker.io/kjlion/kejilion-panel:0.14.0"
    local panel_gid=""

    [ -d "${app_dir}" ] && [ -f "${app_dir}/docker-compose.yml" ] || {
        echo "未找到 KPanel 安装目录。"
        return 1
    }
    panel_gid="$(getent group kejilion-panel | cut -d: -f3)"
    [ -n "${panel_gid}" ] || return 1

    cd "${app_dir}" || return 1
    rm -f "${app_dir}/bin/kejilion-agent.new" \
        "${app_dir}/bin/kejilion-agent.rollback" \
        "${app_dir}/docker-compose.yml.rollback" \
        "${app_dir}/kejilion-agent.service.rollback" \
        "${app_dir}/agent.env.rollback"
    docker pull "${panel_image}" || return 1
    kpanel_extract_agent "${panel_image}" "${app_dir}/bin/kejilion-agent.new" || return 1
    cp -p "${app_dir}/bin/kejilion-agent" "${app_dir}/bin/kejilion-agent.rollback" || return 1
    cp -p "${app_dir}/docker-compose.yml" "${app_dir}/docker-compose.yml.rollback" || return 1
    cp -p "${app_dir}/kejilion-agent.service" "${app_dir}/kejilion-agent.service.rollback" || return 1
    cp -p "${app_dir}/agent.env" "${app_dir}/agent.env.rollback" || return 1

    if ! kpanel_write_compose "${panel_gid}" || ! kpanel_write_agent_service; then
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service"
        mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env"
        rm -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent.rollback"
        return 1
    fi
    if ! systemctl stop kejilion-agent.service; then
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service"
        mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env"
        rm -f "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent.rollback"
        return 1
    fi
    mv "${app_dir}/bin/kejilion-agent.new" "${app_dir}/bin/kejilion-agent" || {
        mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
        mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service"
        mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env"
        rm -f "${app_dir}/bin/kejilion-agent.rollback"
        systemctl start kejilion-agent.service
        return 1
    }

    if systemctl daemon-reload &&
        systemctl start kejilion-agent.service &&
        docker compose --env-file .env up -d --force-recreate &&
        kpanel_wait_ready; then
        rm -f "${app_dir}/bin/kejilion-agent.rollback" \
            "${app_dir}/docker-compose.yml.rollback" \
            "${app_dir}/kejilion-agent.service.rollback" \
            "${app_dir}/agent.env.rollback"
        echo "KPanel 更新完成 / Update Complete"
        return 0
    fi

    echo "更新失败，正在自动回滚..."
    systemctl stop kejilion-agent.service >/dev/null 2>&1
    mv "${app_dir}/bin/kejilion-agent.rollback" "${app_dir}/bin/kejilion-agent"
    mv "${app_dir}/docker-compose.yml.rollback" "${app_dir}/docker-compose.yml"
    mv "${app_dir}/kejilion-agent.service.rollback" "${app_dir}/kejilion-agent.service"
    mv "${app_dir}/agent.env.rollback" "${app_dir}/agent.env"
    systemctl daemon-reload
    systemctl start kejilion-agent.service
    docker compose --env-file .env up -d --force-recreate
    kpanel_wait_ready || echo "回滚后的服务仍未就绪，请人工检查。"
    return 1
}

docker_app_uninstall() {
    local app_dir="/home/docker/kpanel"

    if [ -f "${app_dir}/docker-compose.yml" ]; then
        cd "${app_dir}" || return 1
        docker compose --env-file .env down --rmi all
    fi
    systemctl disable --now kejilion-agent.service >/dev/null 2>&1 || true
    if [ -L /etc/systemd/system/kejilion-agent.service ] &&
        [ "$(readlink -f /etc/systemd/system/kejilion-agent.service)" = "${app_dir}/kejilion-agent.service" ]; then
        rm -f /etc/systemd/system/kejilion-agent.service
    fi
    systemctl daemon-reload
    rm -rf "${app_dir}"
    groupdel kejilion-panel >/dev/null 2>&1 || true
    echo "KPanel 已卸载，配置、审计记录与面板数据已清理。"
}

# --- 注册 / Registration ---
docker_app_plus
