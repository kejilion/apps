# Official: https://actualbudget.org/
# Tested stable version; set APP_IMAGE in .env to upgrade deliberately after backup.
local app_id="actual-budget"
local app_name="Actual Budget"
local app_text="个人预算与记账，管理账户、分类和收支；远程使用需配置 HTTPS 域名"
local app_url="https://actualbudget.org/"
local docker_name="actual-budget"
local docker_port="5006"
local app_size="1"

actual_budget_owned_dir() {
    local app_dir="/home/docker/actual-budget" entry
    if [ -L /home/docker ] || [ -L "$app_dir" ] ||
       [ ! -f "$app_dir/.kejilion-app" ] || [ -L "$app_dir/.kejilion-app" ] ||
       [ "$(cat "$app_dir/.kejilion-app" 2>/dev/null)" != "actual-budget" ]; then
        echo "未找到 Actual Budget 安装记录，拒绝操作已有目录" >&2
        return 1
    fi
    for entry in .env docker-compose.yml .initialized data extensions postgres redis storage; do
        [ ! -L "$app_dir/$entry" ] || { echo "拒绝操作符号链接: $entry" >&2; return 1; }
    done
}

actual_budget_wait_ready() {
    local attempt web_port status
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    for attempt in $(seq 1 60); do
        status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 "http://127.0.0.1:${web_port}/")"
        case "$status" in 200|302|303) return 0 ;; esac
        sleep 2
    done
    echo "Actual Budget 启动检查失败，配置和数据已保留，请查看 docker compose logs。" >&2
    return 1
}

actual_budget_finish_setup() {
    local password web_port response
    [ -f .initialized ] && return 0
    password="$(sed -n 's/^ADMIN_PASSWORD=//p' .env)"
    web_port="$(sed -n 's/^APP_PORT=//p' .env)"
    [[ "$password" =~ ^[a-f0-9]{48}$ ]] || return 1
    response="$(curl -fsS --max-time 30 -H 'Content-Type: application/json' --data "{\"password\":\"${password}\"}" "http://127.0.0.1:${web_port}/account/bootstrap")" || return 1
    printf '%s' "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' || return 1
    sed -i 's/^APP_BIND=127.0.0.1$/APP_BIND=127.0.0.1/' .env || return 1

    docker compose up -d || return 1
    actual_budget_wait_ready || return 1
    (umask 077; printf '%s\n' initialized > .initialized)
}

docker_app_install() {
    local app_dir="/home/docker/actual-budget" password secret
    if [ -L /home/docker ] || [ -L "$app_dir" ]; then
        echo "安装目录是符号链接，拒绝写入" >&2; return 1
    fi
    if [ -e "$app_dir" ]; then
        actual_budget_owned_dir || return 1
        if [ -f "$app_dir/.env" ] && [ -f "$app_dir/docker-compose.yml" ]; then
            docker_app_update; return $?
        fi
        echo "已有目录不完整，请检查后重试；不会覆盖配置。" >&2; return 1
    fi
    if docker container inspect "$docker_name" >/dev/null 2>&1; then
        echo "同名容器已存在，拒绝覆盖" >&2; return 1
    fi
    if ! [[ "$docker_port" =~ ^[1-9][0-9]{0,4}$ ]] || [ "$docker_port" -gt 65535 ]; then
        echo "端口必须为 1-65535 整数" >&2; return 1
    fi
    password="$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" || return 1
    secret="$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')" || return 1
    [ ${#password} -eq 48 ] && [ ${#secret} -eq 64 ] || return 1
    mkdir -p /home/docker || return 1
    mkdir -m 700 -- "$app_dir" || return 1
    printf '%s\n' actual-budget > "$app_dir/.kejilion-app" || return 1
    mkdir -p "$app_dir/data" || return 1
    (umask 077; cat > "$app_dir/.env" <<EOF
APP_PORT=${docker_port}
COMPOSE_PROJECT_NAME=kejilion-actual-budget
APP_BIND=127.0.0.1
APP_IMAGE=actualbudget/actual-server:26.10.0
ADMIN_PASSWORD=${password}
APP_SECRET=${secret}

EOF
    ) || return 1
    cat > "$app_dir/docker-compose.yml" <<'EOF'
services:
  app:
    image: actualbudget/actual-server:26.10.0
    container_name: actual-budget
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ACTUAL_LOGIN_METHOD: password
      ACTUAL_ALLOWED_LOGIN_METHODS: password
    ports:
      - '${APP_BIND}:${APP_PORT}:5006'
    volumes:
      - ./data:/data
EOF
    cd "$app_dir" || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    actual_budget_wait_ready || return 1
    actual_budget_finish_setup || { echo "初始化未完成，服务保留在本机；请检查日志后重试。" >&2; return 1; }
    echo "Actual Budget 安装完成。使用生成的服务器密码登录。"
    echo "初始密码保存在 $app_dir/.env 的 ADMIN_PASSWORD，请在服务器本机查看。"
    echo "服务监听 127.0.0.1:$docker_port；请通过 HTTPS 域名反向代理到此端口。"
    echo "保留 Cross-Origin-Opener-Policy: same-origin 与 Cross-Origin-Embedder-Policy: require-corp 响应头。"
    echo "本机可使用 http://localhost:$docker_port；远程直接 HTTP IP 访问不满足浏览器要求。"
    echo "数据位于 $app_dir；备份前请 docker compose stop 并复制整个目录，完成后再启动。"
}

docker_app_update() {
    actual_budget_owned_dir || return 1
    cd /home/docker/actual-budget || return 1
    [ -f .env ] && [ -f docker-compose.yml ] || return 1
    local image
    image="$(sed -n 's/^APP_IMAGE=//p' .env)"
    [[ "$image" =~ ^[a-zA-Z0-9./_:@-]+$ ]] || return 1
    sed -i "0,/^    image: /s|^    image: .*|    image: $image|" docker-compose.yml || return 1
    docker compose config --quiet || return 1
    docker compose pull || return 1
    docker compose up -d || return 1
    actual_budget_wait_ready || return 1
    actual_budget_finish_setup || return 1
    echo "Actual Budget 更新完成，账号与数据已保留。镜像版本由 .env 的 APP_IMAGE 控制；升级版本前请备份。"
}

docker_app_uninstall() {
    actual_budget_owned_dir || return 1
    cd /home/docker/actual-budget || return 1
    [ -f docker-compose.yml ] || return 1
    docker compose down || return 1
    cd /home/docker || return 1
    rm -rf -- /home/docker/actual-budget || return 1
    echo "Actual Budget 已卸载，应用数据已清理。"
}

docker_app_plus
