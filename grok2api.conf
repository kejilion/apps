# Official: https://github.com/chenyme/grok2api
# Grok2API is a Go gateway with an integrated React administration console.

# --- 基础信息 / Basic Information ---
local app_id="grok2api"
local app_name="Grok2API"
local app_text="多账号 Grok API 网关，支持 OpenAI/Anthropic 兼容接口与管理控制台"
local app_url="https://github.com/chenyme/grok2api"
local docker_name="grok2api"
# 8100 不与当前 apps/ 目录中声明的默认端口重复；用户仍可在安装时自定义。
local docker_port="${docker_port:-8100}"
local app_size="2"

# 下载当前官方 Compose 文件及其可选 quality-guard profile 所需的构建文件。
# 下载完成后再替换，避免网络中断留下半更新的 Compose 文件。
grok2api_download_release_files() {
    local app_dir="$1"
    local raw_url="${gh_proxy}https://raw.githubusercontent.com/chenyme/grok2api/main"
    local temp_dir="${app_dir}/.release-download"

    rm -rf "${temp_dir}"
    mkdir -p "${temp_dir}/tools/egress-quality-guard" || return 1

    if ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        -o "${temp_dir}/docker-compose.yml" "${raw_url}/docker-compose.yml" || \
       ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        -o "${temp_dir}/tools/egress-quality-guard/Dockerfile" \
        "${raw_url}/tools/egress-quality-guard/Dockerfile" || \
       ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        -o "${temp_dir}/tools/egress-quality-guard/quality_guard.py" \
        "${raw_url}/tools/egress-quality-guard/quality_guard.py"; then
        rm -rf "${temp_dir}"
        echo "下载 Grok2API 发布文件失败，请检查网络后重试。"
        return 1
    fi

    mkdir -p "${app_dir}/tools/egress-quality-guard" || return 1
    mv "${temp_dir}/docker-compose.yml" "${app_dir}/docker-compose.yml" || return 1
    mv "${temp_dir}/tools/egress-quality-guard/Dockerfile" \
        "${app_dir}/tools/egress-quality-guard/Dockerfile" || return 1
    mv "${temp_dir}/tools/egress-quality-guard/quality_guard.py" \
        "${app_dir}/tools/egress-quality-guard/quality_guard.py" || return 1
    rm -rf "${temp_dir}"
}

grok2api_wait_for_health() {
    local app_dir="$1"
    local attempt

    for attempt in $(seq 1 30); do
        if curl -fsS --max-time 3 "http://127.0.0.1:${docker_port}/healthz" >/dev/null; then
            return 0
        fi
        sleep 2
    done

    echo "Grok2API 未在 60 秒内通过 /healthz 健康检查，最近日志如下："
    (cd "${app_dir}" && docker compose logs --tail=100 grok2api)
    return 1
}

docker_app_install() {
    local app_dir="/home/docker/${app_name}"
    local raw_url="${gh_proxy}https://raw.githubusercontent.com/chenyme/grok2api/main"
    local jwt_secret
    local credential_encryption_key
    local admin_password

    if ! [[ "${docker_port}" =~ ^[1-9][0-9]{0,4}$ ]] || [ "${docker_port}" -gt 65535 ]; then
        echo "端口必须是 1-65535 之间的整数。"
        return 1
    fi

    mkdir -p "${app_dir}" || return 1
    cd "${app_dir}" || return 1

    if [ -e "config.yaml" ]; then
        echo "检测到已有配置文件：${app_dir}/config.yaml"
        echo "请使用更新功能，而不是重复安装。"
        return 1
    fi

    jwt_secret=$(openssl rand -hex 32 2>/dev/null) || {
        echo "无法生成 JWT 密钥，安装已停止。"
        return 1
    }
    credential_encryption_key=$(openssl rand -base64 32 2>/dev/null) || {
        echo "无法生成凭据加密密钥，安装已停止。"
        return 1
    }
    admin_password=$(openssl rand -base64 24 2>/dev/null) || {
        echo "无法生成管理员密码，安装已停止。"
        return 1
    }

    if ! grok2api_download_release_files "${app_dir}" || \
       ! curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        -o "${app_dir}/config.yaml" "${raw_url}/config.example.yaml"; then
        echo "下载 Grok2API 配置模板失败，安装已停止。"
        return 1
    fi

    sed -i \
        -e "s|replace-with-at-least-32-characters|${jwt_secret}|" \
        -e "s|replace-with-base64-key|${credential_encryption_key}|" \
        -e "s|replace-with-a-strong-password|${admin_password}|" \
        "${app_dir}/config.yaml" || return 1
    chmod 600 "${app_dir}/config.yaml" || return 1

    cat > "${app_dir}/.env" <<EOF
# 由 kejilion.sh 生成；可在服务停止后按需调整。
GROK2API_PORT=${docker_port}
TZ=Asia/Shanghai
EOF
    chmod 600 "${app_dir}/.env" || return 1

    if ! docker compose config -q; then
        echo "Grok2API Compose 配置校验失败，安装已停止。"
        return 1
    fi
    docker compose pull || return 1
    docker compose up -d || return 1
    grok2api_wait_for_health "${app_dir}" || return 1

    echo ""
    echo "Grok2API 安装完成。"
    echo "访问地址：http://\${server_ip}:${docker_port}/"
    echo "管理员账号：admin"
    echo "管理员密码：${admin_password}"
    echo "配置文件：${app_dir}/config.yaml"
    echo "请妥善保存密码；首次登录后修改管理员密码，并不要更换 credentialEncryptionKey。"
    echo "如通过 HTTPS 反向代理公开服务，请将 config.yaml 中 auth.secureCookies 设为 true 后重启。"
    check_docker_app_ip
}

docker_app_update() {
    local app_dir="/home/docker/${app_name}"

    cd "${app_dir}" || return 1
    if [ ! -f "config.yaml" ]; then
        echo "检测到旧版 FastAPI 部署，不能安全地自动迁移到当前 Go 版本。"
        echo "请先按上游文档导出旧账号数据，再卸载并重新安装最新版 Grok2API。"
        return 1
    fi

    grok2api_download_release_files "${app_dir}" || return 1
    if ! docker compose config -q; then
        echo "Grok2API Compose 配置校验失败，更新已停止。"
        return 1
    fi
    docker compose pull || return 1
    docker compose up -d || return 1
    grok2api_wait_for_health "${app_dir}" || return 1
    echo "Grok2API 已更新至最新版，并通过 /healthz 健康检查。"
}

docker_app_uninstall() {
    local app_dir="/home/docker/${app_name}"

    cd "${app_dir}" || return 1
    docker compose down --volumes --rmi all
    rm -rf "${app_dir}"
    echo "Grok2API 已卸载，容器、镜像、卷和应用目录均已清理。"
}

# --- 注册（必须包含）/ Registration (Mandatory) ---
docker_app_plus
