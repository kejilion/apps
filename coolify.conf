# 安装前需启用 OpenSSH 公钥认证，并允许 root 使用密钥连接本机。
# SSH 配置与排错：https://github.com/kejilion/apps/blob/main/docs/coolify.md
local app_id="coolify"
local app_name="Coolify"
local app_text="一个开源的自动化部署平台，是自托管的 Vercel、Netlify、Heroku、Railway 等平台的免费替代方案。"
local app_url="https://coolify.io/docs/start-with-self-hosted"
local docker_name="coolify"
local docker_port="8000"
local app_size="10"

coolify_error() {
    printf 'Coolify: %s\n' "$*" >&2
    return 1
}

coolify_requirements() {
    local command_name compose_version compose_major compose_minor compose_patch
    [ "$(uname -s)" = Linux ] || { coolify_error "仅支持 Linux 服务器。"; return 1; }
    [ "$(id -u)" = 0 ] || { coolify_error "请使用 root 运行应用市场。"; return 1; }
    case "$(uname -m)" in
        x86_64|aarch64|arm64) ;;
        *) coolify_error "仅支持 amd64 / arm64。"; return 1 ;;
    esac
    for command_name in docker curl openssl jq flock readlink sort ssh-keygen sshd getent ss; do
        command -v "$command_name" >/dev/null 2>&1 || {
            coolify_error "缺少依赖：$command_name，请先安装后重试。"; return 1;
        }
    done
    docker info >/dev/null 2>&1 || { coolify_error "Docker 未就绪。"; return 1; }
    docker compose version >/dev/null 2>&1 || return 1
    compose_version=$(docker compose version --short) || return 1
    [[ "$compose_version" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)([-+].*)?$ ]] || {
        coolify_error "无法识别 Docker Compose 版本：$compose_version。"; return 1;
    }
    compose_major=$((10#${BASH_REMATCH[1]}))
    compose_minor=$((10#${BASH_REMATCH[2]}))
    compose_patch=$((10#${BASH_REMATCH[3]}))
    (( compose_major > 2 || (compose_major == 2 && (compose_minor > 24 || (compose_minor == 24 && compose_patch >= 4))) )) || {
        coolify_error "需要 Docker Compose 2.24.4 或更新版本，以安全覆盖核心服务的端口映射。"; return 1;
    }
    docker compose up --help | grep -q -- '--wait-timeout' || {
        coolify_error "请升级 Docker Compose，需支持 up --wait --wait-timeout。"; return 1;
    }
    printf '%s\n' 1.2.0 1.10.0 | sort -V >/dev/null 2>&1 || {
        coolify_error "需要支持 sort -V 的系统工具来比较官方版本。"; return 1;
    }
}

coolify_owned() {
    [ ! -L /home/docker/coolify ] &&
        [ "$(cat /home/docker/coolify/.kpanel-owner 2>/dev/null)" = "coolify-kpanel-v1" ] &&
        [ -L /data/coolify ] &&
        [ "$(readlink /data/coolify)" = /home/docker/coolify ] || {
            coolify_error "安装目录或兼容链接不属于此配置，拒绝接管。"; return 1;
        }
}

coolify_compose() {
    # Also set COMPOSE_PROJECT_NAME in .env so official tooling uses the same project.
    docker compose --project-name coolify --env-file /home/docker/coolify/source/.env \
        -f /home/docker/coolify/source/docker-compose.yml \
        -f /home/docker/coolify/source/docker-compose.prod.yml \
        -f /home/docker/coolify/source/docker-compose.custom.yml "$@"
}

coolify_validate_layout() {
    local configuration database_major app_port realtime_port
    configuration=$(coolify_compose config --format json) || return 1
    app_port=$(sed -n 's/^APP_PORT=//p' /home/docker/coolify/source/.env)
    realtime_port=$(sed -n 's/^REVERB_PORT=//p' /home/docker/coolify/source/.env)
    realtime_port=${realtime_port:-6001}
    # Follow upstream releases only while their deployment layout remains compatible.
    # In particular, never silently create a new PostgreSQL data directory on upgrade.
    if ! printf '%s' "$configuration" | jq -e --arg app_port "$app_port" --arg realtime_port "$realtime_port" '
        .name == "coolify" and
        ((.services | keys | sort) == (["coolify", "postgres", "redis", "coolify-realtime-proxy"] | sort)) and
        .services.coolify.container_name == "coolify" and
        (.services.coolify.image | endswith("/coollabsio/coolify:latest")) and
        .services.postgres.container_name == "coolify-db" and
        .services.redis.container_name == "coolify-redis" and
        .services["coolify-realtime-proxy"].container_name == "coolify-realtime-proxy" and
        all(.services[]; .labels["cn.kejilion.app"] == "coolify") and
        any(.services.coolify.extra_hosts[]?; . == "host.docker.internal=host-gateway" or . == "host.docker.internal:host-gateway") and
        (.services.coolify.ports | length) == 1 and
        (.services.coolify.ports[0] | .target == 8088 and (.published | tostring) == $app_port) and
        any(.services.coolify.volumes[]?; .type == "bind" and .source == "/home/docker/coolify/source/kpanel-entry.conf" and .target == "/etc/nginx/conf.d/kpanel-entry.conf" and .read_only == true) and
        ((.services.coolify.healthcheck.test | join(" ")) | contains("8088/api/health")) and
        (.services["coolify-realtime-proxy"].ports | length) == 2 and
        any(.services["coolify-realtime-proxy"].ports[]; .target == 6001 and (.published | tostring) == $realtime_port) and
        any(.services["coolify-realtime-proxy"].ports[]; .target == 6002 and (.published | tostring) == "6002") and
        ((.services.postgres.ports // []) | length) == 0 and
        ((.services.redis.ports // []) | length) == 0 and
        any(.services.postgres.volumes[]; .type == "volume" and .source == "coolify-db" and .target == "/var/lib/postgresql/data") and
        any(.services.redis.volumes[]; .type == "volume" and .source == "coolify-redis" and .target == "/data") and
        .volumes["coolify-db"].driver_opts.device == "/home/docker/coolify/postgres" and
        .volumes["coolify-redis"].driver_opts.device == "/home/docker/coolify/redis"
    ' >/dev/null; then
        coolify_error "官方 Compose 服务、端口或数据布局发生变化，已停止操作，请先更新适配配置。"; return 1
    fi
    database_major=$(printf '%s' "$configuration" | jq -er '.services.postgres.image | capture("(^|/)postgres:(?<major>[0-9]+)([.-]|$)").major') || {
        coolify_error "无法识别官方 PostgreSQL 镜像的主版本，已停止操作。"; return 1;
    }
    if [ -n "${1:-}" ] && [ "$database_major" != "$1" ]; then
        coolify_error "PostgreSQL 主版本从 $1 变为 $database_major，需要先执行专门的数据迁移。"; return 1
    fi
}

coolify_download_release() {
    local destination="$1"
    local version file
    mkdir -p "$destination" || return 1
    curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
        https://cdn.coollabs.io/coolify/versions.json -o "$destination/versions.json" || return 1
    version=$(jq -er '.coolify.v4.version' "$destination/versions.json") || return 1
    # Use the current official stable Compose layout; the application image always uses :latest.
    # Strict numeric SemVer prevents path/shell injection and excludes prerelease channels.
    [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
        coolify_error "官方稳定版本格式无法识别：$version。"; return 1;
    }
    for file in docker-compose.yml docker-compose.prod.yml .env.production; do
        # kejilion.sh gh_proxy is https:// or https://gh.kejilion.pro/ (includes scheme).
        curl -fsSL --retry 3 --connect-timeout 15 --max-time 120 \
            "${gh_proxy:-https://}raw.githubusercontent.com/coollabsio/coolify/v${version}/${file}" \
            -o "$destination/$file" || return 1
    done
    printf '%s\n' "$version" > "$destination/version" || return 1
}

coolify_write_custom() {
    cat > /home/docker/coolify/source/docker-compose.custom.yml <<'YAML'
services:
  coolify:
    image: "${REGISTRY_URL:-docker.io}/coollabsio/coolify:latest"
    restart: always
    environment:
      HORIZON_ENABLED: "${HORIZON_ENABLED:-true}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-true}"
    # Keep KPanel's main container single-port without Compose appending old ports.
    ports: !override
      - "${APP_PORT:-8000}:8088"
    volumes:
      - /home/docker/coolify/source/kpanel-entry.conf:/etc/nginx/conf.d/kpanel-entry.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 2 http://127.0.0.1:8088/api/health && curl -fsS --max-time 2 http://127.0.0.1:$${PUSHER_BACKEND_PORT:-6001}/up || exit 1"]
      timeout: 5s
    labels:
      cn.kejilion.app: coolify
  coolify-realtime-proxy:
    image: nginx:stable-alpine
    container_name: coolify-realtime-proxy
    restart: always
    ports:
      - "${REVERB_PORT:-${SOKETI_PORT:-6001}}:6001"
      - "6002:6002"
    volumes:
      - /home/docker/coolify/source/realtime-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - coolify
    depends_on:
      coolify:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:6001/up && wget -q -T 3 -O /dev/null http://127.0.0.1:6002/ready || exit 1"]
      interval: 5s
      timeout: 8s
      retries: 24
      start_period: 30s
    labels:
      cn.kejilion.app: coolify
  postgres:
    restart: always
    labels:
      cn.kejilion.app: coolify
  redis:
    restart: always
    labels:
      cn.kejilion.app: coolify
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
volumes:
  coolify-db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/docker/coolify/postgres
    labels:
      cn.kejilion.app: coolify
  coolify-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/docker/coolify/redis
    labels:
      cn.kejilion.app: coolify
YAML
}

coolify_write_entry_config() {
    cat > /home/docker/coolify/source/kpanel-entry.conf <<'NGINX'
# Additional HTTP entry only. The image's default server, PHP and 8080 routes stay upstream-owned.
map $http_upgrade $kpanel_coolify_connection {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $kpanel_coolify_proto {
    default $scheme;
    http http;
    https https;
}
server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    client_max_body_size 2048m;
    client_header_buffer_size 8k;
    large_client_header_buffers 8 32k;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $kpanel_coolify_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $kpanel_coolify_connection;
    proxy_connect_timeout 30s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    # Preserve each complete URI and query string, including terminal authentication.
    location ^~ /app/ { proxy_pass http://127.0.0.1:6001; }
    location ^~ /apps/ { proxy_pass http://127.0.0.1:6001; }
    location = /terminal/ws { proxy_pass http://127.0.0.1:6002; }
    location / { proxy_pass http://127.0.0.1:8080; }
}
NGINX
}

coolify_validate_entry_config() {
    # Only initialize Nginx in a disposable, portless container: never run Laravel migrations here.
    coolify_compose run --rm --no-deps --entrypoint sh coolify -ec '
        test -f /etc/entrypoint.d/10-init-webserver-config.sh
        S6_INITIALIZED=true LOG_OUTPUT_LEVEL=warn sh /etc/entrypoint.d/10-init-webserver-config.sh
        nginx -t
        nginx -T 2>/dev/null | grep -qF "# configuration file /etc/nginx/conf.d/kpanel-entry.conf:"
    ' || { coolify_error "目标镜像不支持当前面板入口配置，未启动新控制面。"; return 1; }
}

coolify_check_entry() {
    coolify_compose exec -T coolify sh -ec '
        nginx -t
        curl -fsS --max-time 10 http://127.0.0.1:8088/api/health >/dev/null
    ' || { coolify_error "面板统一入口检查失败，请检查 Coolify 容器日志。"; return 1; }
}

coolify_write_realtime_config() {
    cat > /home/docker/coolify/source/realtime-proxy.conf <<'NGINX'
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_x_forwarded_proto $coolify_forwarded_proto {
    default $scheme;
    http http;
    https https;
}
access_log /dev/stdout;
error_log /dev/stderr warn;
client_max_body_size 100m;
client_header_buffer_size 8k;
large_client_header_buffers 8 32k;
# Docker DNS is re-resolved when an update replaces the Coolify container.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 6001;
    server_name _;
    set $coolify_backend coolify:6001;
    location / {
        proxy_pass http://$coolify_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coolify_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
server {
    listen 6002;
    server_name _;
    set $coolify_backend coolify:6002;
    location / {
        proxy_pass http://$coolify_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $coolify_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
NGINX
}

coolify_init_env() {
    local app_key db_password redis_password app_token pusher_key pusher_secret version
    app_key=$(openssl rand -base64 32) || return 1
    db_password=$(openssl rand -hex 32) || return 1
    redis_password=$(openssl rand -hex 32) || return 1
    app_token=$(openssl rand -hex 16) || return 1
    pusher_key=$(openssl rand -hex 32) || return 1
    pusher_secret=$(openssl rand -hex 32) || return 1
    version=$(cat /home/docker/coolify/source/version) || return 1
    # Write atomically: failed installations must never rotate an existing APP_KEY.
    (umask 077; cat > /home/docker/coolify/source/.env.new <<ENV
APP_ID=$app_token
APP_NAME=Coolify
APP_ENV=production
APP_KEY=base64:$app_key
APP_PORT=$docker_port
COMPOSE_PROJECT_NAME=coolify
DB_USERNAME=coolify
DB_DATABASE=coolify
DB_PASSWORD=$db_password
REDIS_PASSWORD=$redis_password
PUSHER_APP_ID=$app_token
PUSHER_APP_KEY=$pusher_key
PUSHER_APP_SECRET=$pusher_secret
PUSHER_BACKEND_HOST=127.0.0.1
PUSHER_BACKEND_PORT=6001
REVERB_PORT=6001
REGISTRY_URL=docker.io
LATEST_IMAGE=latest
COOLIFY_VERSION=$version
AUTOUPDATE=false
HORIZON_ENABLED=false
SCHEDULER_ENABLED=false
ENV
    ) || return 1
    mv /home/docker/coolify/source/.env.new /home/docker/coolify/source/.env || return 1
}

coolify_permissions() {
    # Only Coolify-owned files; PostgreSQL and Redis set their own directory ownership.
    chown -R 9999:0 /home/docker/coolify/source /home/docker/coolify/ssh /home/docker/coolify/images || return 1
    chmod 700 /home/docker/coolify/source /home/docker/coolify/ssh /home/docker/coolify/images || return 1
    chmod 600 /home/docker/coolify/source/.env || return 1
    if [ -f /home/docker/coolify/source/localhost-key ]; then
        chmod 600 /home/docker/coolify/source/localhost-key || return 1
    fi
}

coolify_ssh_preflight() {
    local configuration root_record root_home entry authorized_keys port listeners
    sshd -t || { coolify_error "OpenSSH 配置检查失败，未修改 sshd。"; return 1; }
    configuration=$(sshd -T) || return 1
    [ "$(printf '%s\n' "$configuration" | awk '$1 == "pubkeyauthentication" {print $2}')" = yes ] || {
        coolify_error "OpenSSH 未允许公钥认证，请先配置 PubkeyAuthentication。教程：https://github.com/kejilion/apps/blob/main/docs/coolify.md"; return 1;
    }
    case "$(printf '%s\n' "$configuration" | awk '$1 == "permitrootlogin" {print $2}')" in
        yes|prohibit-password|without-password) ;;
        *) coolify_error "OpenSSH 未允许 root 密钥登录，请先配置 PermitRootLogin。"; return 1 ;;
    esac
    root_record=$(getent passwd root) || return 1
    root_home=$(printf '%s\n' "$root_record" | awk -F: '$3 == 0 {print $6}') || return 1
    [[ "$root_home" = /* && "$root_home" != *[[:space:]]* ]] || return 1
    for entry in $(printf '%s\n' "$configuration" | awk '$1 == "authorizedkeysfile" {$1=""; print}'); do
        entry=${entry//%h/$root_home}
        entry=${entry//%u/root}
        [[ "$entry" != *%* && "$entry" != none ]] || continue
        case "$entry" in /*) ;; *) entry="$root_home/$entry" ;; esac
        # Only use a normal file; never follow an authorization-file symlink.
        if [ ! -L "$entry" ] && { [ ! -e "$entry" ] || [ -f "$entry" ]; }; then
            authorized_keys=$entry
            break
        fi
    done
    [ -n "$authorized_keys" ] || { coolify_error "找不到可安全写入的 root AuthorizedKeysFile。"; return 1; }
    port=${COOLIFY_SSH_PORT:-$(printf '%s\n' "$configuration" | awk '$1 == "port" {print $2; exit}')}
    [[ "$port" =~ ^[0-9]{1,5}$ ]] && [ "$((10#$port))" -ge 1 ] && [ "$((10#$port))" -le 65535 ] || {
        coolify_error "无法识别 SSH 端口；可用 COOLIFY_SSH_PORT 指定实际监听端口。"; return 1;
    }
    port=$((10#$port))
    listeners=$(ss -H -ltn) || return 1
    printf '%s\n' "$listeners" | awk -v port="$port" '$4 ~ (":" port "$") {found=1} END {exit !found}' || {
        coolify_error "SSH 端口 $port 未监听；若使用 socket 激活，请用 COOLIFY_SSH_PORT 指定实际端口。"; return 1;
    }
    jq -n --arg authorized_keys "$authorized_keys" --argjson port "$port" \
        '{authorized_keys:$authorized_keys,port:$port}'
}

coolify_write_localhost_helper() {
    cat > /home/docker/coolify/source/kpanel-localhost.php <<'PHP'
<?php
ini_set('display_errors', '0');
$action = $argv[1] ?? '';
if (! in_array($action, ['configure', 'validate', 'identity'], true)) {
    fwrite(STDERR, "Unknown localhost action.\n");
    exit(1);
}
try {
    require '/var/www/html/vendor/autoload.php';
    $app = require '/var/www/html/bootstrap/app.php';
    $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
    $server = App\Models\Server::findOrFail(0);
    if ((string) $server->ip !== 'host.docker.internal' || (string) $server->user !== 'root') {
        throw new RuntimeException('The localhost server identity has changed.');
    }
    if ($action === 'configure') {
        foreach (['horizon' => 'HORIZON_ENABLED', 'scheduler-worker' => 'SCHEDULER_ENABLED'] as $service => $flag) {
            $run = @file_get_contents("/etc/s6-overlay/s6-rc.d/{$service}/run");
            $environment = @file_get_contents('/var/www/html/.env');
            if (! is_string($run) || ! str_contains($run, "{$flag}=false") ||
                ! str_contains($run, 'exec sleep infinity') ||
                ! is_string($environment) || ! preg_match('/^'.preg_quote($flag, '/').'=false$/m', $environment)) {
                throw new RuntimeException('The official background-worker initialization barrier is unavailable.');
            }
        }
        $expectedKey = preg_split('/\s+/', trim($argv[3] ?? ''));
        $actualKey = preg_split('/\s+/', trim($server->privateKey?->getPublicKey() ?? ''));
        if (count($expectedKey) < 2 || array_slice($expectedKey, 0, 2) !== array_slice($actualKey, 0, 2)) {
            throw new RuntimeException('The official seeder did not import this installation SSH key.');
        }
        $server->port = (int) $argv[2];
        $server->proxy->set('type', App\Enums\ProxyTypes::NONE->value);
        $server->proxy->set('status', 'exited');
        $server->save();
        $server->settings->server_role = App\Enums\ServerRole::BOTH;
        $server->settings->is_build_server = false;
        $server->settings->force_disabled = false;
        $server->settings->save();
    } elseif ($action === 'validate') {
        if (App\Actions\Server\ValidateServer::run($server) !== 'OK') {
            throw new RuntimeException('Official localhost validation failed.');
        }
        echo "OK\n";
        exit(0);
    } elseif ($action !== 'identity') {
        throw new RuntimeException('Unknown localhost action.');
    }
    $server->refresh();
    echo json_encode([
        'server_uuid' => $server->uuid,
        'sentinel_token_sha256' => hash('sha256', (string) $server->settings->sentinel_token),
        'proxy_type' => $server->proxyType(),
        'proxy_configuration_sha256' => hash('sha256', trim((string) $server->proxy->get('last_saved_proxy_configuration'))),
    ], JSON_THROW_ON_ERROR), "\n";
} catch (Throwable $error) {
    // Exception messages can contain SQL parameters; never put them in market task logs.
    fwrite(STDERR, "Coolify localhost {$action} failed (".get_class($error)."). Check localhost validation logs in Coolify.\n");
    exit(1);
}
PHP
}

coolify_ssh_prepare() {
    local configuration="$1"
    [ ! -e /home/docker/coolify/source/localhost-key ] || return 1
    (umask 077; ssh-keygen -t ed25519 -a 100 -q -N '' -C kpanel-coolify-localhost \
        -f /home/docker/coolify/source/localhost-key) || return 1
    printf '%s\n' "$configuration" > /home/docker/coolify/source/localhost-ssh.json || return 1
    coolify_write_localhost_helper || return 1
    cp /home/docker/coolify/source/localhost-key /home/docker/coolify/ssh/keys/id.root@host.docker.internal || return 1
    chmod 600 /home/docker/coolify/ssh/keys/id.root@host.docker.internal || return 1
}

coolify_localhost() {
    local port public_key
    port=$(jq -er '.port' /home/docker/coolify/source/localhost-ssh.json) || return 1
    public_key=$(cat /home/docker/coolify/source/localhost-key.pub) || return 1
    coolify_compose exec -T -u 9999 coolify php /dev/stdin "$1" "$port" "$public_key" \
        < /home/docker/coolify/source/kpanel-localhost.php
}

coolify_ssh_authorize() {
    local authorized_keys public_key private_public directory temporary
    authorized_keys=$(jq -er '.authorized_keys' /home/docker/coolify/source/localhost-ssh.json) || return 1
    [[ "$authorized_keys" = /* && "$authorized_keys" != *[[:space:]]* ]] && [ ! -L "$authorized_keys" ] || return 1
    public_key=$(awk '{print $1" "$2}' /home/docker/coolify/source/localhost-key.pub) || return 1
    [[ "$public_key" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+$ ]] || return 1
    private_public=$(ssh-keygen -y -f /home/docker/coolify/source/localhost-key) || return 1
    private_public=$(printf '%s\n' "$private_public" | awk '{print $1" "$2}') || return 1
    [ "$public_key" = "$private_public" ] || { coolify_error "本机 SSH 密钥与公钥标记不匹配。"; return 1; }
    directory=$(dirname "$authorized_keys") || return 1
    if [ ! -d "$directory" ]; then
        (umask 077; mkdir -p "$directory") || return 1
    fi
    [ ! -L "$directory" ] || return 1
    if [ ! -e "$authorized_keys" ]; then
        (umask 077; touch "$authorized_keys") || return 1
    fi
    [ -f "$authorized_keys" ] || return 1
    # Preserve every existing key, comment and option. Only append this dedicated key once.
    if ! awk -v key="$public_key" '$1" "$2 == key {found=1} END {exit !found}' "$authorized_keys"; then
        temporary=$(mktemp "$directory/.coolify-authorized.XXXXXX") || return 1
        cp -p "$authorized_keys" "$temporary" && \
            { cat "$authorized_keys"; printf '\n%s kpanel-coolify-localhost\n' "$public_key"; } > "$temporary" && \
            mv "$temporary" "$authorized_keys" || { rm -f "$temporary"; return 1; }
    fi
    chmod 600 "$authorized_keys" || return 1
}

coolify_ssh_revoke() {
    local authorized_keys public_key private_public temporary
    authorized_keys=$(jq -er '.authorized_keys' /home/docker/coolify/source/localhost-ssh.json) || return 1
    [[ "$authorized_keys" = /* && "$authorized_keys" != *[[:space:]]* ]] && [ ! -L "$authorized_keys" ] || return 1
    public_key=$(awk '{print $1" "$2}' /home/docker/coolify/source/localhost-key.pub) || return 1
    [[ "$public_key" =~ ^ssh-ed25519\ [A-Za-z0-9+/=]+$ ]] || return 1
    private_public=$(ssh-keygen -y -f /home/docker/coolify/source/localhost-key) || return 1
    private_public=$(printf '%s\n' "$private_public" | awk '{print $1" "$2}') || return 1
    [ "$public_key" = "$private_public" ] || { coolify_error "本机 SSH 密钥与公钥标记不匹配，拒绝清除授权。"; return 1; }
    [ -e "$authorized_keys" ] || return 0
    [ -f "$authorized_keys" ] || return 1
    temporary=$(mktemp "$(dirname "$authorized_keys")/.coolify-authorized.XXXXXX") || return 1
    cp -p "$authorized_keys" "$temporary" && \
        awk -v key="$public_key" '$1" "$2 != key {print}' "$authorized_keys" > "$temporary" && \
        mv "$temporary" "$authorized_keys" || { rm -f "$temporary"; return 1; }
}

coolify_finish_localhost() {
    local identity current expected
    if [ ! -f /home/docker/coolify/source/localhost-ready ]; then
        # Official s6 switches keep all queued proxy/sentinel jobs asleep until NONE is saved.
        grep -qx HORIZON_ENABLED=false /home/docker/coolify/source/.env && \
            grep -qx SCHEDULER_ENABLED=false /home/docker/coolify/source/.env || {
                coolify_error "本机初始化屏障丢失，拒绝在后台任务运行时添加 SSH 授权。"; return 1;
            }
        identity=$(coolify_localhost configure) || return 1
        printf '%s\n' "$identity" | jq -e '.server_uuid | type == "string" and length > 0' >/dev/null || return 1
        printf '%s\n' "$identity" > /home/docker/coolify/source/localhost-identity.json || return 1
        coolify_ssh_authorize || return 1
        [ "$(coolify_localhost validate)" = OK ] || { coolify_error "本机 SSH/Docker 验证失败，未启用后台任务。"; return 1; }
        # Mark this phase before recreating: a failed restart can resume without rotating keys.
        printf '%s\n' validated > /home/docker/coolify/source/localhost-ready || return 1
        sed -i 's/^HORIZON_ENABLED=.*/HORIZON_ENABLED=true/;s/^SCHEDULER_ENABLED=.*/SCHEDULER_ENABLED=true/' /home/docker/coolify/source/.env || return 1
        coolify_compose up -d --force-recreate --wait --wait-timeout 300 coolify || return 1
    else
        expected=$(jq -er '.server_uuid' /home/docker/coolify/source/localhost-identity.json) || return 1
        identity=$(coolify_localhost identity) || return 1
        current=$(printf '%s\n' "$identity" | jq -er '.server_uuid') || return 1
        [ "$current" = "$expected" ] || { coolify_error "本机实例标记不匹配。"; return 1; }
        [ "$(coolify_localhost validate)" = OK ] || return 1
        # Recover the interval between a successful validation and enabling both workers.
        if ! grep -qx HORIZON_ENABLED=true /home/docker/coolify/source/.env || \
           ! grep -qx SCHEDULER_ENABLED=true /home/docker/coolify/source/.env; then
            sed -i 's/^HORIZON_ENABLED=.*/HORIZON_ENABLED=true/;s/^SCHEDULER_ENABLED=.*/SCHEDULER_ENABLED=true/' /home/docker/coolify/source/.env || return 1
            coolify_compose up -d --force-recreate --wait --wait-timeout 300 coolify || return 1
        fi
    fi
    coolify_compose up -d --wait --wait-timeout 300 || return 1
}

coolify_sentinel_owned() {
    local container_json="$1" identity="$2" token actual expected
    printf '%s' "$container_json" | jq -e '.[0] |
        .Name == "/coolify-sentinel" and .Config.Labels["coolify.managed"] == "true" and
        (.Config.Image | test("^(docker.io/|ghcr.io/)?coollabsio/sentinel(:|@)")) and
        any(.Mounts[]?; .Destination == "/app/db" and
            (.Source == "/data/coolify/sentinel" or .Source == "/home/docker/coolify/sentinel"))' >/dev/null || return 1
    token=$(printf '%s' "$container_json" | jq -er '.[0].Config.Env[] | select(startswith("TOKEN=")) | ltrimstr("TOKEN=")') || return 1
    [ -n "$token" ] || return 1
    actual=$(printf '%s' "$token" | openssl dgst -sha256 | awk '{print $NF}') || return 1
    expected=$(printf '%s' "$identity" | jq -er '.sentinel_token_sha256') || return 1
    [ "$actual" = "$expected" ]
}

coolify_port_check() {
    local port
    [[ "$docker_port" =~ ^[0-9]{1,5}$ ]] &&
        [ "$((10#$docker_port))" -ge 1 ] && [ "$((10#$docker_port))" -le 65535 ] || {
            coolify_error "无效的面板端口。"; return 1;
        }
    docker_port=$((10#$docker_port))
    case "$docker_port" in
        6001|6002) coolify_error "面板端口不能使用实时服务保留端口 6001/6002。"; return 1 ;;
    esac
    # Provided by current kejilion.sh; the Compose bind check is the final authority.
    if declare -F kpanel_app_port_in_use >/dev/null; then
        for port in "$docker_port" 6001 6002; do
            if kpanel_app_port_in_use "$port"; then
                coolify_error "端口 $port 已被占用，请先解决冲突。"; return 1
            fi
        done
    fi
}

coolify_managed_containers() {
    local name owner project found=false
    for name in coolify coolify-db coolify-redis coolify-realtime-proxy; do
        if docker container inspect "$name" >/dev/null 2>&1; then
            found=true
            owner=$(docker inspect -f '{{index .Config.Labels "cn.kejilion.app"}}' "$name") || return 1
            project=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$name") || return 1
            [ "$owner" = coolify ] && [ "$project" = coolify ] || {
                coolify_error "容器 $name 不属于本配置，拒绝操作。"; return 1;
            }
        fi
    done
    if [ "${1:-}" = required ] && [ "$found" = false ]; then
        coolify_error "没有找到本配置的容器，拒绝更新或清除遗留数据。"; return 1
    fi
}

coolify_resume_install() {
    local name version
    flock -n 9 || { coolify_error "另一个操作正在运行。"; return 1; }
    coolify_owned || return 1
    [ ! -e /home/docker/coolify/source/uninstall-approved.json ] || {
        coolify_error "上次卸载尚未完成，请先重试卸载。"; return 1;
    }
    coolify_managed_containers || return 1
    for name in .env version docker-compose.yml docker-compose.prod.yml docker-compose.custom.yml realtime-proxy.conf localhost-key localhost-key.pub localhost-ssh.json kpanel-localhost.php; do
        [ -s "/home/docker/coolify/source/$name" ] || {
            coolify_error "首次安装的配置未写完整，请检查失败原因并按说明清理空安装后重试。"; return 1;
        }
    done
    for name in coolify-db coolify-redis; do
        if docker volume inspect "$name" >/dev/null 2>&1; then
            [ "$(docker volume inspect -f '{{index .Labels "cn.kejilion.app"}}' "$name")" = coolify ] || {
                coolify_error "数据卷 $name 不属于此配置，拒绝恢复。"; return 1;
            }
        fi
    done
    if docker network inspect coolify >/dev/null 2>&1; then
        [ "$(docker network inspect -f '{{index .Labels "cn.kejilion.app"}}' coolify)" = coolify ] || return 1
    else
        docker network create --attachable --label cn.kejilion.app=coolify coolify >/dev/null || return 1
    fi
    # Keep stored secrets and port; migrate only the image selector to the requested latest channel.
    version=$(cat /home/docker/coolify/source/version) || return 1
    [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || return 1
    sed -i "s/^LATEST_IMAGE=.*/LATEST_IMAGE=latest/;s/^COOLIFY_VERSION=.*/COOLIFY_VERSION=$version/" /home/docker/coolify/source/.env || return 1
    docker_port=$(sed -n 's/^APP_PORT=//p' /home/docker/coolify/source/.env)
    [[ "$docker_port" =~ ^[0-9]{1,5}$ ]] || return 1
    # The official key-directory seeder may have removed this file before initialization failed.
    if [ ! -f /home/docker/coolify/source/localhost-ready ]; then
        cp /home/docker/coolify/source/localhost-key /home/docker/coolify/ssh/keys/id.root@host.docker.internal || return 1
        chmod 600 /home/docker/coolify/ssh/keys/id.root@host.docker.internal || return 1
    fi
    coolify_write_custom || return 1
    coolify_write_entry_config || return 1
    coolify_permissions || return 1
    coolify_validate_layout || return 1
    coolify_compose pull || return 1
    coolify_validate_entry_config || return 1
    coolify_compose up -d --force-recreate --wait --wait-timeout 300 || return 1
    coolify_finish_localhost || return 1
    coolify_check_entry || return 1
    echo "已恢复原有 Coolify 安装与本机 SSH，保留原端口和密钥。请立即创建管理员。"
    check_docker_app_ip
}

docker_app_install() {
    coolify_requirements || return 1
    local name ssh_configuration
    if [ -e /home/docker/coolify ] || [ -L /home/docker/coolify ] ||
       [ -e /data/coolify ] || [ -L /data/coolify ]; then
        coolify_owned || return 1
        coolify_resume_install 9>/home/docker/coolify/.lifecycle.lock
        return $?
    fi
    for name in coolify coolify-db coolify-redis coolify-realtime coolify-realtime-proxy coolify-sentinel coolify-proxy coolify-proxy-logrotate; do
        if docker container inspect "$name" >/dev/null 2>&1; then
            coolify_error "已有容器 $name，拒绝覆盖。"; return 1
        fi
    done
    for name in coolify-db coolify-redis; do
        if docker volume inspect "$name" >/dev/null 2>&1; then
            coolify_error "已有数据卷 $name，拒绝覆盖。"; return 1
        fi
    done
    if docker network inspect coolify >/dev/null 2>&1; then
        coolify_error "已有 coolify 网络，拒绝接管。"; return 1
    fi
    coolify_port_check || return 1
    ssh_configuration=$(coolify_ssh_preflight) || return 1
    mkdir -p /home/docker/coolify || return 1
    chmod 755 /home/docker/coolify || return 1
    printf '%s\n' coolify-kpanel-v1 > /home/docker/coolify/.kpanel-owner || return 1
    mkdir -p /data || return 1
    ln -s /home/docker/coolify /data/coolify || return 1
    mkdir -p /home/docker/coolify/{source,ssh/keys,ssh/mux,applications,databases,services,backups,proxy/dynamic,sentinel,images,postgres,redis} || return 1
    for name in applications databases services backups proxy sentinel; do
        chown -R 9999:0 "/home/docker/coolify/$name" || return 1
        chmod -R 700 "/home/docker/coolify/$name" || return 1
    done
    coolify_download_release /home/docker/coolify/source || return 1
    coolify_write_custom || return 1
    coolify_write_entry_config || return 1
    coolify_write_realtime_config || return 1
    coolify_init_env || return 1
    coolify_ssh_prepare "$ssh_configuration" || return 1
    coolify_permissions || return 1
    coolify_validate_layout || return 1
    docker network create --attachable --label cn.kejilion.app=coolify coolify >/dev/null || return 1
    coolify_compose pull || return 1
    coolify_validate_entry_config || return 1
    coolify_compose up -d --wait --wait-timeout 300 || {
        coolify_error "启动未通过健康检查；保留数据用于排查，请勿删除 .env。"; return 1;
    }
    coolify_finish_localhost || return 1
    coolify_check_entry || return 1
    echo "Coolify 面板安装完成。请立即注册管理员并备份 /home/docker/coolify/source/.env。"
    echo "本机 SSH 已通过官方验证，可构建与部署；Sentinel 由 Coolify 官方独立管理。"
    echo "面板端口：$docker_port；请在 KPanel 应用详情绑定面板域名，页面、实时连接和终端共用该入口。"
    check_docker_app_ip
}

coolify_apply_release() {
    local file
    for file in docker-compose.yml docker-compose.prod.yml .env version; do
        cp "$1/$file" "/home/docker/coolify/source/$file" || return 1
    done
    coolify_write_custom || return 1
    coolify_write_entry_config || return 1
    coolify_permissions || return 1
    coolify_validate_layout "$2" || return 1
    coolify_compose pull || return 1
    coolify_validate_entry_config || return 1
}

docker_app_update() {
    coolify_requirements || return 1
    coolify_owned || return 1
    coolify_managed_containers required || return 1
    [ ! -e /home/docker/coolify/source/uninstall-approved.json ] || {
        coolify_error "上次卸载尚未完成，请先重试卸载。"; return 1;
    }
    local backup stage version file current_version database_major configuration
    # A subshell makes lock release reliable on every error path, even inside KPanel's if-call.
    (
        flock -n 9 || { coolify_error "另一个操作正在运行。"; exit 1; }
        stage=$(mktemp -d /home/docker/coolify/source/.release.XXXXXX) || exit 1
        trap "$(printf 'rm -rf -- %q' "$stage")" EXIT
        coolify_download_release "$stage" || exit 1
        version=$(cat "$stage/version") || exit 1
        current_version=$(cat /home/docker/coolify/source/version) || exit 1
        [[ "$current_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] &&
            [ "$(printf '%s\n' "$current_version" "$version" | sort -V | head -n 1)" = "$current_version" ] || {
                coolify_error "当前版本 $current_version 不允许自动降级到 $version。"; exit 1;
            }
        configuration=$(coolify_compose config --format json) || exit 1
        database_major=$(printf '%s' "$configuration" | jq -er '.services.postgres.image | capture("(^|/)postgres:(?<major>[0-9]+)([.-]|$)").major') || exit 1
        backup=$(mktemp -d /home/docker/coolify/backups/pre-update.XXXXXX) || exit 1
        chmod 700 "$backup" || exit 1
        for file in .env docker-compose.yml docker-compose.prod.yml docker-compose.custom.yml realtime-proxy.conf version localhost-key localhost-key.pub localhost-ssh.json kpanel-localhost.php localhost-identity.json localhost-ready; do
            cp -p "/home/docker/coolify/source/$file" "$backup/$file" || exit 1
        done
        for file in kpanel-entry.conf; do
            if [ -e "/home/docker/coolify/source/$file" ]; then
                cp -p "/home/docker/coolify/source/$file" "$backup/$file" || exit 1
            fi
        done
        # A database backup is mandatory; never update after a failed/empty dump.
        coolify_compose exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
            > "$backup/database.dump" || exit 1
        [ -s "$backup/database.dump" ] || exit 1
        chmod 600 "$backup/database.dump" || exit 1
        echo "更新前备份：$backup（卸载将一并删除，请另存到服务器外）。"
        # Keep secrets and custom port; append only new upstream defaults.
        awk -F= '!seen[$1]++' /home/docker/coolify/source/.env "$stage/.env.production" \
            > "$stage/.env" || exit 1
        sed -i "s/^LATEST_IMAGE=.*/LATEST_IMAGE=latest/;s/^COOLIFY_VERSION=.*/COOLIFY_VERSION=$version/;s/^AUTOUPDATE=.*/AUTOUPDATE=false/" "$stage/.env" || exit 1
        if ! coolify_apply_release "$stage" "$database_major"; then
            for file in .env docker-compose.yml docker-compose.prod.yml docker-compose.custom.yml realtime-proxy.conf version localhost-key localhost-key.pub localhost-ssh.json kpanel-localhost.php localhost-identity.json localhost-ready; do
                cp -p "$backup/$file" "/home/docker/coolify/source/$file" || exit 1
            done
            for file in kpanel-entry.conf; do
                if [ -e "$backup/$file" ]; then
                    cp -p "$backup/$file" "/home/docker/coolify/source/$file" || exit 1
                else
                    rm -f "/home/docker/coolify/source/$file" || exit 1
                fi
            done
            coolify_error "启动前检查/拉取失败，已还原配置，现有容器未重建。"
            exit 1
        fi
        # Recreate after successful lint so updated bind-mounted Nginx content is always loaded.
        if ! coolify_compose up -d --force-recreate --wait --wait-timeout 300; then
            coolify_error "更新未通过健康检查。备份：$backup；请先排查，不要直接降级已迁移的数据库。"
            exit 1
        fi
        coolify_check_entry || exit 1
        [ "$(coolify_localhost validate)" = OK ] || { coolify_error "更新后本机 SSH 验证未通过。"; exit 1; }
        echo "Coolify 已拉取官方 latest 镜像（当前官方布局 $version）；原密钥、端口和数据已保留。"
    ) 9>/home/docker/coolify/.lifecycle.lock
}

docker_app_uninstall() {
    coolify_requirements || return 1
    coolify_owned || return 1
    if [ -s /home/docker/coolify/source/uninstall-approved.json ]; then
        coolify_managed_containers || return 1
    else
        coolify_managed_containers required || return 1
    fi
    local container_json container_ids item query_status active_projects directory_entry identity expected
    local resume_uninstall=false images checkpoint sentinel_id sentinel_image checkpoint_new
    (
        flock -n 9 || { coolify_error "另一个操作正在运行。"; exit 1; }
        checkpoint=/home/docker/coolify/source/uninstall-approved.json
        if [ -s "$checkpoint" ]; then
            # Only a previously checked, stopped installation may resume without its database.
            if ! docker container inspect coolify >/dev/null 2>&1 ||
               [ "$(docker inspect -f '{{.State.Running}}' coolify)" = false ]; then
                resume_uninstall=true
                identity=$(jq -e '.identity' "$checkpoint") || exit 1
            fi
        fi
        if [ "$resume_uninstall" = false ]; then
            identity=$(coolify_localhost identity) || exit 1
            expected=$(jq -er '.server_uuid' /home/docker/coolify/source/localhost-identity.json) || exit 1
            [ "$(printf '%s' "$identity" | jq -er '.server_uuid')" = "$expected" ] || exit 1
        fi
        # Stopped business containers and unrelated mounts remain protected on every retry.
        container_ids=$(docker ps -aq) || exit 1
        for item in $container_ids; do
            container_json=$(docker inspect "$item") || exit 1
            if [ "$(printf '%s' "$container_json" | jq -er '.[0].Name')" = /coolify-sentinel ]; then
                coolify_sentinel_owned "$container_json" "$identity" || {
                    coolify_error "Sentinel 的令牌、镜像或持久目录不属于本实例，拒绝删除。"; exit 1;
                }
                continue
            fi
            if printf '%s' "$container_json" | jq -e '
                .[0] | ((.Name != "/coolify") and (.Name != "/coolify-db") and (.Name != "/coolify-redis") and (.Name != "/coolify-realtime-proxy")) and
                (.Config.Labels["coolify.managed"] == "true" or
                    any(.Mounts[]?; .Name == "coolify-db" or .Name == "coolify-redis" or
                                   .Source == "/data/coolify" or .Source == "/home/docker/coolify" or
                                   ((.Source // "") | startswith("/data/coolify/")) or
                                   ((.Source // "") | startswith("/home/docker/coolify/"))))' >/dev/null; then
                coolify_error "仍有业务容器、代理或其他数据挂载。请先迁移业务；自定义代理须先在 Coolify 中停止并删除。"
                exit 1
            else
                query_status=$?
                [ "$query_status" = 1 ] || exit 1
            fi
        done
        if [ "$resume_uninstall" = false ]; then
            active_projects=$(coolify_compose exec -T postgres sh -c \
                'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT (EXISTS (SELECT 1 FROM projects) OR EXISTS (SELECT 1 FROM servers WHERE id <> 0))::int;"') || exit 1
            [ "$active_projects" = 0 ] || {
                coolify_error "仍有项目或远程服务器登记，请先在 Coolify 中迁移并删除这些资源。"; exit 1;
            }
        fi
        for item in applications databases services; do
            directory_entry=$(find "/home/docker/coolify/$item" -mindepth 1 -print -quit) || exit 1
            [ -z "$directory_entry" ] || {
                coolify_error "$item 目录非空。请先迁移业务并确认数据，拒绝清除。"; exit 1;
            }
        done
        for item in coolify-db coolify-redis; do
            if docker volume inspect "$item" >/dev/null 2>&1; then
                [ "$(docker volume inspect -f '{{index .Labels "cn.kejilion.app"}}' "$item")" = coolify ] || exit 1
            fi
        done
        if docker network inspect coolify >/dev/null 2>&1; then
            [ "$(docker network inspect -f '{{index .Labels "cn.kejilion.app"}}' coolify)" = coolify ] || exit 1
        fi
        if [ "$resume_uninstall" = false ]; then
            images=$(coolify_compose images -q) || exit 1
            jq -n --argjson identity "$identity" --arg images "$images" \
                '{identity:$identity,images:($images | split("\n") | map(select(length > 0)) | unique)}' > "$checkpoint" || exit 1
            chmod 600 "$checkpoint" || exit 1
        fi
        echo "卸载将删除 Coolify 控制面数据库、专用本机授权、密钥和本机备份。"
        # Stop Horizon and the scheduler before touching Sentinel, so it cannot be recreated.
        coolify_compose stop coolify || exit 1
        if docker container inspect coolify-sentinel >/dev/null 2>&1; then
            container_json=$(docker inspect coolify-sentinel) || exit 1
            coolify_sentinel_owned "$container_json" "$identity" || exit 1
            sentinel_id=$(printf '%s' "$container_json" | jq -er '.[0].Id') || exit 1
            sentinel_image=$(printf '%s' "$container_json" | jq -er '.[0].Image') || exit 1
            checkpoint_new=$(mktemp /home/docker/coolify/source/.uninstall.XXXXXX) || exit 1
            jq --arg image "$sentinel_image" '.images |= (. + [$image] | unique)' "$checkpoint" > "$checkpoint_new" && \
                mv "$checkpoint_new" "$checkpoint" || { rm -f "$checkpoint_new"; exit 1; }
            docker rm -f "$sentinel_id" >/dev/null || exit 1
        fi
        coolify_ssh_revoke || exit 1
        # Image cleanup is separate: another application may use postgres, redis or nginx.
        coolify_compose down --volumes || exit 1
        if docker network inspect coolify >/dev/null 2>&1; then
            docker network rm coolify >/dev/null || exit 1
        fi
        for item in $(jq -er '.images[]?' "$checkpoint"); do
            docker image rm "$item" >/dev/null 2>&1 || echo "保留仍被使用或不能删除的镜像：$item"
        done
        rm /data/coolify || exit 1
        rm -rf -- /home/docker/coolify || exit 1
        echo "Coolify 已卸载，专用本机授权、应用目录与兼容链接已清理。"
    ) 9>/home/docker/coolify/.lifecycle.lock
}

docker_app_plus
